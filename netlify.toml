# ============================================================
#  Netlify · Interlanguage
#  La WEB PÚBLICA vive en la carpeta "web-publica/".
#  Con esto Netlify publica esa carpeta como raíz del sitio,
#  y lee "web-publica/_headers" para caché y seguridad.
#
#  (La plataforma "Interlanguage HOME" es un proyecto aparte:
#   se desarrolla en /plataforma y se desplegará por separado
#   cuando esté lista para producción.)
# ============================================================
[build]
  publish = "web-publica"

# ------------------------------------------------------------
#  form-handler.php es el receptor PHP para hosting Arsys. Netlify NO ejecuta PHP:
#  sin esta regla el navegador descargaría el código fuente. Se responde con la 404.
#  (Si el envío de formularios se traslada a otro servicio, esta regla sigue siendo correcta.)
# ------------------------------------------------------------
[[redirects]]
  from = "/form-handler.php"
  to = "/404.html"
  status = 404
  force = true
