<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Comparar V5 · estilos de lista</title>
<link rel="stylesheet" href="../css/styles.css?v=144">
<style>
  body{margin:0; background:var(--stone); color:var(--ink); font-family:var(--font-body);}
  .cx-top{position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; background:var(--navy); color:#fff;}
  .cx-top h1{margin:0; font:600 1.25rem/1.2 var(--font-display); color:#fff;}
  .cx-top p{margin:2px 0 0; font-size:.85rem; color:rgba(255,255,255,.78);}
  .cx-sw{display:inline-flex; padding:4px; border-radius:999px; background:rgba(255,255,255,.12);}
  .cx-sw button{border:0; background:none; color:#fff; font:700 .88rem/1 var(--font-body); padding:10px 18px; border-radius:999px; cursor:pointer;}
  .cx-sw button[aria-pressed="true"]{background:#fff; color:var(--navy);}
  .cx-idx{display:flex; flex-wrap:wrap; gap:8px; max-width:1500px; margin:0 auto; padding:20px 24px 0;}
  .cx-idx a{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font:700 .84rem/1 var(--font-body); color:var(--navy); text-decoration:none;}
  .cx-idx a:hover{border-color:var(--navy);}
  .cx{display:grid; gap:34px; padding:24px 24px 60px; max-width:1500px; margin:0 auto;}
  .cx-it{display:grid; gap:8px; min-width:0; scroll-margin-top:90px;}
  .cx-it h2{margin:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; font:600 1.2rem/1.2 var(--font-display); color:var(--navy);}
  .cx-it h2 span{font:700 .72rem/1 var(--font-body); letter-spacing:.12em; text-transform:uppercase; color:var(--accent);}
  .cx-it small{font-size:.88rem; color:var(--ink-soft); max-width:80ch;}
  .cx-it iframe{display:block; width:100%; height:560px; border:1px solid var(--line); border-radius:12px; background:#fff;}
  .cx-it--ref iframe{height:620px;}
  /* móvil: todas a la vez, una junto a otra, cada una a 390 px */
  .is-m .cx{grid-template-columns:repeat(auto-fill,390px); justify-content:center; column-gap:24px;}
  .is-m .cx-it iframe{width:390px;}
  .is-m .cx-it--ref iframe{height:780px;}
</style>
</head>
<body>
<header class="cx-top">
  <div><h1>Formulario V5 · seis estilos de la lista</h1><p>Todos en una página. Podéis pulsar en cada uno para ver el paso siguiente: es la maqueta, no se envía nada.</p></div>
  <div class="cx-sw" role="group" aria-label="Pantalla"><button type="button" data-m="d" aria-pressed="true">Escritorio</button><button type="button" data-m="m" aria-pressed="false">Móvil</button></div>
</header>
<nav class="cx-idx" id="idx" aria-label="Ir a un estilo"></nav>
<main class="cx" id="cx"></main>
<script>
(function(){
  var L=[
    ['ref','Referencia','Un programa para cada momento','Así está ahora en la portada, para comparar las fotos.'],
    ['lista','B1','Lista','La que elegiste: foto pequeña con esquinas redondeadas, etiqueta encima del título y flecha.'],
    ['sangre','B2','Foto a sangre','La foto ocupa todo el alto de la fila, sin margen. Más fotográfica y con más peso visual.'],
    ['filas','B3','Filas agrupadas','Sin cajas: filas separadas por líneas y numeradas, en dos grupos que explican qué pasa después («Con asesoramiento» / «Inscripción directa»). La más editorial.'],
    ['capsula','B4','Cápsulas','Foto redonda y solo el título: lo más compacto. Las cuatro caben en una línea.'],
    ['marino','B5','Fondo marino','La misma lista sobre azul marino: el formulario se distingue de las secciones claras de la portada.'],
    ['ancha','B6','Filas anchas','Una sola columna, foto más grande y una línea con lo que pasa al elegir (os llamamos o reserváis plaza).']
  ];
  /* las maquetas comparten el borrador guardado: se borra antes de cargarlas, para que todas empiecen en la elección de programa */
  function clean(){ try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('fm-borrador-v5')===0) localStorage.removeItem(k); }); }catch(e){} }
  clean();
  var cx=document.getElementById('cx'), idx=document.getElementById('idx');
  L.forEach(function(x){
    var src = x[0]==='ref' ? '../index.html' : 'form-v5.html?ctx=general&pick='+x[0];
    cx.insertAdjacentHTML('beforeend','<section class="cx-it'+(x[0]==='ref'?' cx-it--ref':'')+'" id="s-'+x[0]+'"><h2><span>'+x[1]+'</span>'+x[2]+'</h2><small>'+x[3]+'</small><iframe src="'+src+'" title="'+x[1]+' · '+x[2]+'" data-k="'+x[0]+'"></iframe></section>');
    idx.insertAdjacentHTML('beforeend','<a href="#s-'+x[0]+'">'+(x[0]==='ref'?'Referencia':x[1]+' · '+x[2])+'</a>');
  });
  /* el marco se ajusta al contenido de cada maqueta (también al pasar al formulario) */
  function fit(f){ try{ var d=f.contentDocument; if(!d||!d.body) return; f.style.height=Math.max(320, d.documentElement.scrollHeight)+'px'; }catch(e){} }
  cx.querySelectorAll('iframe').forEach(function(f){
    f.addEventListener('load',function(){
      try{
        var w=f.contentWindow;
        if(f.dataset.k==='ref'){ var s=w.document.getElementById('servicios'); if(s) setTimeout(function(){ w.scrollTo(0, s.getBoundingClientRect().top + w.scrollY - 70); },300); return; }   /* baja dentro del marco sin mover esta página */
        fit(f); if(w.ResizeObserver) new w.ResizeObserver(function(){ fit(f); }).observe(w.document.body);
      }catch(e){}
    });
  });
  document.querySelectorAll('.cx-sw button').forEach(function(b){ b.addEventListener('click',function(){
    document.querySelectorAll('.cx-sw button').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
    document.body.classList.toggle('is-m', b.dataset.m==='m');
    clean(); cx.querySelectorAll('iframe').forEach(function(f){ f.src=f.src; });   /* recarga para que cada maqueta se coloque con su ancho */
  }); });
})();
</script>
</body>
</html>
