<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Formulario · V6 Exprés</title>
<link rel="stylesheet" href="../css/styles.css?v=144"><link rel="stylesheet" href="fm.css">
<style>
  body{background:#fff; margin:0;}
  .v6{position:relative; isolation:isolate; overflow:hidden; padding:clamp(44px,6vw,96px) 20px; background:var(--navy); color:#fff;}
  .v6 > img{position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:70% 40%;}
  .v6::after{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(22,41,74,.95) 0%, rgba(22,41,74,.86) 50%, rgba(22,41,74,.55) 100%);}
  .v6-in{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(28px,5vw,72px); align-items:center; max-width:1180px; margin:0 auto;}
  .v6-t{display:grid; gap:16px; justify-items:start;}
  .v6-t p.eb{margin:0; font:700 .74rem/1.3 var(--font-body); letter-spacing:.16em; text-transform:uppercase; color:var(--accent-soft);}
  .v6-t h2{margin:0; font-family:var(--font-display); font-size:clamp(2.1rem,3.8vw,3.2rem); line-height:1.04; color:#fff;} .v6-t h2 em{display:block; font-style:italic; font-weight:500; color:var(--accent-soft);}
  .v6-t .lead{margin:0; color:rgba(255,255,255,.86); max-width:42ch;}
  .v6-pts{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 0; padding:0; list-style:none;}
  .v6-pts li{display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border:1px solid rgba(255,255,255,.3); border-radius:999px; font:600 .84rem/1 var(--font-body);}
  .v6-pts .fm-ic{color:var(--accent-soft); width:15px; height:15px;}
  .v6-card{background:#fff; color:var(--ink); border-radius:var(--r-card); padding:clamp(22px,3vw,36px); box-shadow:0 24px 70px rgba(0,0,0,.25);}
  .v6-card h3{margin:0 0 4px; font:600 1.5rem/1.15 var(--font-display); color:var(--navy);} .v6-card h3 + p, .v6-card > p{margin:0 0 18px; font-size:.9rem; color:var(--ink-soft);}
  .v6-card .fm-field + .fm-field{margin-top:16px;}
  .v6-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;} .v6-card .v6-row .fm-field + .fm-field{margin-top:0;} .v6-row + .v6-row, .v6-row + .fm-field, .fm-field + .v6-row{margin-top:16px;}
  .v6-send{display:grid; gap:10px; margin-top:20px;} .v6-send .fm-btn{width:100%; min-height:56px; font-size:1.05rem;}
  .v6-send p{margin:0; text-align:center; font-size:.82rem; color:var(--ink-soft);}
  .v6-more{display:grid; gap:16px; margin-top:18px; padding:18px; border-radius:var(--r-sm); background:var(--ivory);}
  .v6-more h4{margin:0; font:600 1.15rem/1.2 var(--font-display); color:var(--navy);} .v6-more > p{margin:-8px 0 0; font-size:.86rem; color:var(--ink-soft);}
  .v6-saved{display:flex; align-items:center; gap:8px; font:700 .86rem/1 var(--font-body); color:var(--forest);}
  @media (max-width:900px){ .v6-in{grid-template-columns:1fr;} .v6::after{background:rgba(22,41,74,.9);} }
  @media (max-width:560px){ .v6-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<section class="v6 fm">
  <img src="../images/internacional/ext-hero-colegio-luz.jpg" alt="">
  <div class="v6-in">
    <div class="v6-t" id="t"></div>
    <div class="v6-card"><div id="restore"></div><form id="f" novalidate onsubmit="return false"></form></div>
  </div>
</section>
<script src="fm-core.js"></script>
<script>
(function(){
  var S=FM.create('v6'), f=document.getElementById('f'), C=FM.CTX[S.ctx];
  document.getElementById('t').innerHTML='<p class="eb">'+C.eyebrow+'</p><h2>'+C.h+'</h2><p class="lead">Dejadnos cuatro datos y os llamamos. El resto lo hablamos con calma.</p><ul class="v6-pts"><li>'+FM.ic('clock')+'30 segundos</li><li>'+FM.ic('check')+'Sin compromiso</li><li>'+FM.ic('lock')+'Datos protegidos</li></ul>';
  var QUICK={general:'programa',estudiar:'destino',campamento:'colegio'};
  function render(){
    var p=FM.prog(S), q=QUICK[S.ctx];
    if(p==='madrid'||p==='extra'){ f.innerHTML='<h3>Inscripción directa</h3><p>Para este programa no hace falta asesoramiento.</p>'+FM.direct(S)+'<p style="margin-top:14px"><button type="button" class="fm-back" data-reset>'+FM.ic('back')+' Elegir otro programa</button></p>'; return; }
    var h='<h3>Os llamamos nosotros</h3><p>Todos los campos son necesarios salvo el teléfono.</p>';
    h+=FM.field(S,q,{big:false});
    h+='<div class="v6-row">'+FM.field(S,'edad')+FM.field(S,'nombre')+'</div><div class="v6-row">'+FM.field(S,'email')+FM.field(S,'tel')+'</div>';
    h+='<div style="margin-top:16px">'+FM.field(S,'rgpd')+'</div>';
    h+='<div class="v6-send"><button type="button" class="fm-btn fm-btn--p" data-send>Quiero que me orientéis '+FM.ic('arrow')+'</button><p>Os responderemos personalmente, en Madrid.</p></div>';
    f.innerHTML=h; live('init');
  }
  var live=FM.bind(S,f,function(id){ if(id==='programa') render(); });
  function after(){
    var p=FM.prog(S), pf=p==='campamento'?['semanas','ingles']:['duracion','inicio'];
    f.innerHTML=FM.thanks(S)+'<div class="v6-more fm-anim" id="more"><h4>¿Nos contáis algo más? <span class="fm-optional">opcional</span></h4><p>Con esto os llamaremos con opciones ya pensadas para vuestro hijo.</p>'+
      pf.map(function(id){return FM.field(S,id);}).join('')+FM.field(S,'nivel')+FM.field(S,'intereses')+FM.field(S,'pref')+FM.field(S,'franja')+FM.field(S,'news')+
      '<div class="fm-row-act"><button type="button" class="fm-btn fm-btn--p" data-more>Añadir a mi consulta '+FM.ic('arrow')+'</button></div></div>';
    live('init'); f.querySelector('.fm-done').focus();
  }
  f.addEventListener('click',function(e){
    if(e.target.closest('[data-reset]')){ delete S.v.programa; FM.save(S); return render(); }
    if(e.target.closest('[data-send]')){ var q=QUICK[S.ctx], ids=[q,'edad','nombre','email','tel','rgpd'], er=FM.groupErrors(S,{f:ids});
      if(!S.v[q]&&q!=='programa') er[q]='Elegid una opción para continuar.';
      if(!FM.showAll(f,er,ids)) return; after(); return; }
    if(e.target.closest('[data-more]')){ FM.clear(S); var m=document.getElementById('more'); m.innerHTML='<p class="v6-saved">'+FM.ic('check')+' Añadido a vuestra consulta. ¡Gracias!</p>'; var r=f.querySelector('.fm-recap'); if(r) r.innerHTML=FM.summary(S).map(function(x){return '<li><span>'+x[0]+'</span><b>'+x[1]+'</b></li>';}).join(''); }
  });
  f.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){ e.preventDefault(); var b=f.querySelector('[data-send],[data-more]'); if(b) b.click(); } });
  if(S.restored){ var r=document.getElementById('restore'); r.innerHTML='<div class="fm-restore" style="margin-bottom:14px"><span>Hemos recuperado lo que empezasteis a rellenar.</span><button type="button">Empezar de cero</button></div>'; r.querySelector('button').onclick=function(){ FM.clear(S); location.reload(); }; }
  render();
})();
</script>
</body>
</html>
