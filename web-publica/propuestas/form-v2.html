<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Formulario · V2 Tarjeta y resumen</title>
<link rel="stylesheet" href="../css/styles.css?v=144"><link rel="stylesheet" href="fm.css">
<style>
  body{background:var(--navy); margin:0;}
  .v2{padding:clamp(40px,6vw,88px) 24px; color:#fff;}
  .v2-in{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:clamp(28px,5vw,72px); align-items:start; max-width:1240px; margin:0 auto;}
  .v2-side{position:sticky; top:24px; display:grid; gap:22px;}
  .v2-side p.eb{margin:0; font:700 .74rem/1.3 var(--font-body); letter-spacing:.16em; text-transform:uppercase; color:var(--accent-soft);}
  .v2-side h2{margin:0; font-family:var(--font-display); font-size:clamp(2rem,3.4vw,2.8rem); line-height:1.06; color:#fff;}
  .v2-side h2 em{display:block; font-style:italic; font-weight:500; color:var(--accent-soft);}
  .v2-side .lead{margin:0; color:rgba(255,255,255,.84);}
  .v2-sum{padding:20px; border-radius:var(--r-card); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);}
  .v2-sum h3{margin:0 0 10px; font:600 1.25rem/1.1 var(--font-display); color:#fff;}
  .v2-sum ul{display:grid; margin:0; padding:0; list-style:none;}
  .v2-sum li{display:grid; grid-template-columns:110px 1fr; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.14); font-size:.9rem;}
  .v2-sum li span{color:rgba(255,255,255,.62);} .v2-sum li b{color:#fff;}
  .v2-sum .empty{margin:0; font-size:.88rem; color:rgba(255,255,255,.62);}
  @media (prefers-reduced-motion:no-preference){ .v2-sum li.new{animation:fm-in .25s var(--e) both;} }
  .v2-next{display:grid; margin:0; padding:0; list-style:none;}
  .v2-next li{display:grid; grid-template-columns:30px 1fr; gap:2px 12px; padding:11px 0; border-top:1px solid rgba(255,255,255,.14);}
  .v2-next b{grid-row:1 / span 2; font:500 1.4rem/1 var(--font-display); color:var(--accent-soft);} .v2-next strong{font-size:.95rem;} .v2-next span{font-size:.85rem; color:rgba(255,255,255,.72);}
  .v2-card{background:#fff; color:var(--ink); border-radius:var(--r-card); padding:clamp(22px,3.4vw,40px);}
  .v2-steps{display:grid; grid-template-columns:repeat(var(--n,3),1fr); gap:8px; margin:0 0 26px; padding:0; list-style:none;}
  .v2-steps li{display:grid; gap:8px; font:700 .8rem/1.2 var(--font-body); color:var(--ink-soft); cursor:default;}
  .v2-steps li::before{content:""; height:4px; border-radius:4px; background:var(--stone); transition:background-color .25s var(--e);}
  .v2-steps li.on, .v2-steps li.done{color:var(--navy);} .v2-steps li.on::before{background:var(--accent);} .v2-steps li.done::before{background:var(--navy);}
  .v2-steps li.done{cursor:pointer;} .v2-steps li.done:hover{color:var(--accent);}
  .v2-h{margin:0 0 18px; font:600 clamp(1.4rem,2.2vw,1.7rem)/1.15 var(--font-display); color:var(--navy);}
  .v2-more{margin-top:22px; border-top:1px solid var(--line);}
  .v2-more summary{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 0 4px; cursor:pointer; list-style:none; font:700 .94rem/1.2 var(--font-body); color:var(--navy);}
  .v2-more summary::-webkit-details-marker{display:none;}
  .v2-more summary::after{content:"+"; font:500 1.5rem/1 var(--font-body); color:var(--accent); transition:transform .2s var(--e);}
  .v2-more[open] summary::after{transform:rotate(45deg);}
  .v2-more > div{padding-top:14px;}
  .v2-row{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;} .v2-row .fm-field + .fm-field{margin-top:0;}
  .v2-act{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .v2-act .right{display:flex; align-items:center; gap:14px; margin-left:auto;}
  @media (max-width:900px){ .v2-in{grid-template-columns:1fr;} .v2-side{position:static;} .v2-next{display:none;} }
  @media (max-width:560px){ .v2-row{grid-template-columns:1fr; gap:22px;} .v2-act .fm-btn{flex:1;} }
</style>
</head>
<body>
<section class="v2 fm"><div class="v2-in">
  <aside class="v2-side" id="side"></aside>
  <div class="v2-card"><div id="restore"></div><form id="f" novalidate onsubmit="return false"></form></div>
</div></section>
<script src="fm-core.js"></script>
<script>
(function(){
  var S=FM.create('v2'), f=document.getElementById('f'), side=document.getElementById('side'), at=0, shown={};
  var C=FM.CTX[S.ctx];
  var OPT={alumno:['nivel','intereses'], contacto:['franja','mensaje']};
  function sideHTML(){
    var rows=FM.summary(S), html='<p class="eb">'+C.eyebrow+'</p><h2>'+C.h+'</h2><p class="lead">'+C.lead+'</p><div class="v2-sum" aria-live="polite"><h3>Vuestra consulta</h3>';
    html+= rows.length ? '<ul>'+rows.map(function(r){ var isNew=!shown[r[0]+r[1]]; shown[r[0]+r[1]]=1; return '<li'+(isNew?' class="new"':'')+'><span>'+r[0]+'</span><b>'+r[1]+'</b></li>'; }).join('')+'</ul>' : '<p class="empty">Aquí irá apareciendo lo que elijáis.</p>';
    html+='</div><ol class="v2-next">'+FM.NEXT.map(function(n,i){return '<li><b>'+(i+1)+'</b><strong>'+n[0]+'</strong><span>'+n[1]+'</span></li>';}).join('')+'</ol>';
    return html;
  }
  function render(){
    var G=FM.groups(S), g=G[at]||G[0], n=G.length;
    var h='<ol class="v2-steps" style="--n:'+n+'">'+G.map(function(x,i){return '<li class="'+(i===at?'on':i<at?'done':'')+'" data-step="'+i+'">'+(i+1)+' · '+x.t+'</li>';}).join('')+'</ol><div class="fm-anim">';
    if(g.id==='direct'){ h+=FM.direct(S)+'</div>'; f.innerHTML=h+'<div class="v2-act"><button type="button" class="fm-back" data-prev>'+FM.ic('back')+' Atrás</button></div>'; side.innerHTML=sideHTML(); live('init'); return; }
    var titles={que:S.ctx==='general'?'¿Qué buscáis?':(FM.prog(S)==='campamento'?'El campamento':'El programa'),alumno:'Sobre el alumno',contacto:'¿Cómo os contactamos?'};
    h+='<p class="v2-h">'+titles[g.id]+'</p>';
    var main=g.f.filter(function(id){return (OPT[g.id]||[]).indexOf(id)<0;}), extra=OPT[g.id]||[];
    if(g.id==='alumno'){ h+='<div class="v2-row">'+FM.field(S,'edad')+FM.field(S,'curso')+'</div>'; }
    else if(g.id==='contacto'){ h+='<div class="v2-row">'+FM.field(S,'nombre')+FM.field(S,'email')+'</div><div class="v2-row" style="margin-top:22px">'+FM.field(S,'tel')+FM.field(S,'pref')+'</div>'; }
    else h+=main.map(function(id){return FM.field(S,id,{big:id==='programa'});}).join('');
    if(extra.length) h+='<details class="v2-more"'+(extra.some(function(k){var v=S.v[k];return v&&(v.length||v===true);})?' open':'')+'><summary>'+(g.id==='alumno'?'Añadir más detalles del alumno':'Añadir horario o un comentario')+' <span class="fm-optional">opcional</span></summary><div>'+extra.map(function(id){return FM.field(S,id);}).join('')+'</div></details>';
    if(g.id==='contacto') h+='<div style="margin-top:22px; display:grid; gap:14px">'+FM.field(S,'rgpd')+FM.field(S,'news')+'</div>';
    h+='</div><div class="v2-act">'+(at>0?'<button type="button" class="fm-back" data-prev>'+FM.ic('back')+' Atrás</button>':'<span class="fm-secure">'+FM.ic('lock')+' Solo para responder a esta consulta</span>')+'<span class="right">';
    h+= at===n-1 ? '<button type="button" class="fm-btn fm-btn--p" data-send>Enviar consulta '+FM.ic('arrow')+'</button>' : '<button type="button" class="fm-btn fm-btn--p" data-next>Continuar '+FM.ic('arrow')+'</button>';
    f.innerHTML=h+'</span></div>'; side.innerHTML=sideHTML(); live('init');
  }
  var live=FM.bind(S,f,function(id){ if(id==='programa'){ render(); return; } side.innerHTML=sideHTML(); });
  if(S.restored){ var r=document.getElementById('restore'); r.innerHTML='<div class="fm-restore" style="margin-bottom:18px"><span>Hemos recuperado lo que empezasteis a rellenar.</span><button type="button">Empezar de cero</button></div>'; r.querySelector('button').onclick=function(){ FM.clear(S); location.reload(); }; }
  f.addEventListener('click',function(e){
    var G=FM.groups(S), g=G[at];
    var st=e.target.closest('[data-step]'); if(st&&+st.dataset.step<at){ at=+st.dataset.step; return render(); }
    if(e.target.closest('[data-prev]')){ at=Math.max(0,at-1); return render(); }
    if(e.target.closest('[data-next]')){ if(!FM.showAll(f,FM.groupErrors(S,g),g.f)) return; at++; render(); f.closest('.v2-card').scrollIntoView({block:'nearest'}); var x=f.querySelector('select,input[type=text],input[type=email]'); if(x) x.focus({preventScroll:true}); return; }
    if(e.target.closest('[data-send]')){ if(!FM.showAll(f,FM.groupErrors(S,g),g.f)) return; FM.clear(S); f.innerHTML=FM.thanks(S); document.getElementById('restore').innerHTML=''; f.querySelector('.fm-done').focus(); }
  });
  f.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='SUMMARY'){ e.preventDefault(); var b=f.querySelector('[data-send],[data-next]'); if(b) b.click(); } });
  render();
})();
</script>
</body>
</html>
