<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil · Interlanguage HOME</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css?v=20260809d">
<link rel="stylesheet" href="app.css?v=20260809d">
<link rel="stylesheet" href="etapa.css?v=20260809d">
<link rel="stylesheet" href="shell.css?v=20260809d">
<style>
  .pf-hd{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-soft);}
  .pf-av{width:72px;height:72px;border-radius:var(--il-radius-lg);background:var(--il-primary);color:#fff;display:grid;place-items:center;box-shadow:var(--il-shadow-md);}
  .pf-av svg{width:34px;height:34px}
  .pf-hd .nm{font-family:var(--font-display);font-weight:800;color:var(--navy);font-size:1.3rem;}
  .pf-hd .code{font-size:.82rem;color:var(--soft);margin-top:3px;}
  .pf-hd .code b{color:var(--jade-deep);font-family:var(--font-display);letter-spacing:.02em;}
  .pf-hd .lvl{display:inline-block;margin-top:8px;font-size:.74rem;font-weight:700;color:var(--jade-deep);background:var(--jade-tint);border-radius:100px;padding:4px 11px;}
  .card-soft h3.h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-family:var(--font-display);margin-bottom:12px;}
  .acct-row{display:flex;flex-wrap:wrap;gap:10px;}
  .profile-reward{display:flex;align-items:center;gap:14px;background:var(--il-primary-soft);border:1px solid rgba(22,41,74,.15);border-radius:var(--il-radius-md);padding:16px;text-decoration:none;}
  .profile-reward .gi{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--il-radius-sm);background:var(--il-surface);color:var(--il-primary);flex:0 0 auto;}
.profile-reward .gi svg{width:22px;height:22px;}
.btn-ghost [data-il-icon]{display:inline-flex;vertical-align:-2px;margin-right:6px;}
.btn-ghost [data-il-icon] svg{width:1em;height:1em;}
  .profile-reward b{color:var(--navy);font-family:var(--font-display);display:block;font-size:.98rem;}
  .profile-reward span{font-size:.83rem;color:var(--soft);}
  .profile-reward .go{margin-left:auto;color:var(--il-primary);font-weight:800;font-size:1.2rem;transition:transform .15s ease;}
  .profile-reward:hover .go{transform:translateX(3px);}
  .profile-reward{transition:transform .15s ease,box-shadow .15s ease;}
  .profile-reward:hover{transform:translateY(-2px);box-shadow:var(--il-shadow-md);}
  .pf-progress{padding:var(--il-space-5);border:1px solid var(--il-border);border-radius:var(--il-radius-lg);background:var(--il-surface)}
  .pf-progress__head{display:flex;align-items:center;justify-content:space-between;gap:var(--il-space-3);margin-bottom:var(--il-space-4)}.pf-progress__head h2{margin:0;font-size:var(--il-fs-lg)}.pf-progress__head a{min-height:var(--il-touch);display:inline-flex;align-items:center;color:var(--il-primary);font-family:var(--il-font-display);font-size:var(--il-fs-sm);font-weight:var(--il-weight-bold);text-decoration:none}
  .pf-progress__stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--il-border)}.pf-progress__stat{padding:var(--il-space-4);text-align:center;border-right:1px solid var(--il-border)}.pf-progress__stat:last-child{border-right:0}.pf-progress__stat strong{display:block;color:var(--il-text-primary);font-family:var(--il-font-display);font-size:var(--il-fs-xl)}.pf-progress__stat span{display:block;margin-top:2px;color:var(--il-text-secondary);font-size:var(--il-fs-xs)}
  /* Entradas suaves */
  .pf-hd,.profile-reward,.card-soft{animation:pfIn .34s cubic-bezier(.2,.7,.3,1) both;}
  .profile-reward{animation-delay:.05s;} .card-soft{animation-delay:.1s;}
  @keyframes pfIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (max-width:480px){.pf-progress__stat{padding-inline:var(--il-space-2)}}
  @media (prefers-reduced-motion:reduce){ .pf-hd,.profile-reward,.card-soft{animation:none;} .profile-reward:hover{transform:none;} }
  /* Escritorio: ancho cómodo (no estirar) */
  @media (min-width:1024px){ .app-with-rail .app-shell{max-width:680px;} }
</style>
</head>
<body>
<div id="app" class="hidden app-with-rail">
  <div class="shell">
    <aside class="rail" data-il-rail="perfil"></aside>
    <div class="shell-main">
  <div class="app-shell">
    <div class="pf-hd">
      <div class="pf-av" id="pfAv" aria-hidden="true"><span data-il-icon="plane"></span></div>
      <div>
        <div class="nm" id="pfName">Alumno</div>
        <div class="code">Tu código: <b id="pfCode">—</b></div>
        <div class="lvl" id="pfLevel">Tu nivel de inglés</div>
      </div>
    </div>

    <a href="tienda.html" class="profile-reward">
      <span class="gi" data-il-icon="shirt"></span>
      <span><b>Personalizar tu perfil</b><span>Colores y complementos desbloqueables</span></span>
      <span class="go" aria-hidden="true">›</span>
    </a>

    <section class="pf-progress" aria-labelledby="pfProgressTitle">
      <div class="pf-progress__head"><h2 id="pfProgressTitle">Tu aprendizaje</h2><a href="progreso.html">Ver progreso →</a></div>
      <div class="pf-progress__stats">
        <div class="pf-progress__stat"><strong id="pfSessions">—</strong><span>misiones</span></div>
        <div class="pf-progress__stat"><strong id="pfStreak">—</strong><span>días de racha</span></div>
        <div class="pf-progress__stat"><strong id="pfStamps">—</strong><span>sellos</span></div>
      </div>
    </section>

    <div class="card-soft">
      <h3 class="h">Tu cuenta</h3>
      <div class="acct-row">
        <a href="cambiar-clave.html" class="btn btn-ghost"><span data-il-icon="lock"></span>Cambiar contraseña</a>
        <button class="btn btn-ghost" id="logout">Salir</button>
      </div>
    </div>
  </div>
    </div><!-- /.shell-main -->
  </div><!-- /.shell -->

  <nav class="app-nav" data-il-nav="perfil"></nav>
</div>

<script src="layout.js?v=20260809d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260809d"></script>
<script src="auth-utils.js?v=20260809d"></script>
<script src="etapa.js?v=20260809d"></script>
<script src="auth.js?v=20260809d"></script>
<script src="mission-state.js?v=20260809e"></script>
<script src="progress-data.js?v=20260809b"></script>
<script>
  const $ = (id) => document.getElementById(id);
  (async () => {
    const p = await ILAuth.getProfile();
    if (!p) { location.href = "index.html"; return; }
    if (p.is_admin) { location.href = "admin.html"; return; }
    if (p.must_change_password) { location.href = "cambiar-clave.html"; return; }
    IL_ETAPA.apply(p);
    $("pfName").textContent = p.full_name || "Alumno";
    $("pfCode").textContent = p.username || "—";
    // Nivel: misma fuente de verdad que Progreso y la composición de la sesión (test de colocación)
    try {
      const pl = await ILAuth.getPlacement();
      $("pfLevel").textContent = pl && pl.placed ? pl.label : (p.level || "Sin nivel aún · haz el test");
    } catch (e) { if (p.level) $("pfLevel").textContent = p.level; }
    try {
      const learning = await ILProgressData.load(ILAuth, window.ILMission);
      $("pfSessions").textContent = learning.lessons;
      $("pfStreak").textContent = learning.streak;
      $("pfStamps").textContent = learning.stamps.unlocked;
    } catch (e) {}
    $("app").classList.remove("hidden");
  })();
  $("logout").addEventListener("click", async () => { await ILAuth.signOut(); location.href = "index.html"; });
</script>
</body>
</html>
