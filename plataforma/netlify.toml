# Configuración del sitio "Interlanguage HOME" (la app).
# En Netlify, este sitio usa Base directory = "plataforma", así que Netlify
# lee ESTE netlify.toml y publica la carpeta plataforma tal cual (sin build).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
