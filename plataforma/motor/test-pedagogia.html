<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests · modelo pedagógico</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:820px;margin:24px auto;padding:0 16px;color:#2B3646}
  h1{font-family:system-ui;color:#16294A}
  .t{padding:8px 12px;border-radius:8px;margin:6px 0}
  .pass{background:#E7F1EC;color:#1E9C74}
  .fail{background:#FDECEA;color:#C0392B;font-weight:700}
  #summary{font-size:1.2rem;font-weight:800;padding:12px;border-radius:10px;margin-top:14px}
</style>
</head>
<body>
<h1>🧪 Tests del modelo pedagógico</h1>
<div id="out"></div>
<div id="summary"></div>

<script src="pedagogia.js"></script>
<script>
  const P = window.IL_PEDAGOGIA;
  const out = document.getElementById("out");
  let pass = 0, fail = 0;
  function ok(name, cond) {
    const d = document.createElement("div");
    d.className = "t " + (cond ? "pass" : "fail");
    d.textContent = (cond ? "✅ " : "❌ ") + name;
    out.appendChild(d);
    cond ? pass++ : fail++;
  }
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // 1) Primer intento: new -> practicing
  let m = P.applyAttempt(P.blank("o1"), { correct: true }, "2026-07-30");
  ok("Primer intento pasa de 'new' a 'practicing' (o superior)", m.state !== "new");

  // 2) Camino a Dominado: 3 aciertos en 2 días distintos, últimos 2 correctos
  let a = P.blank("o2");
  a = P.applyAttempt(a, { correct: true }, "2026-07-30");   // día 1
  a = P.applyAttempt(a, { correct: true }, "2026-07-30");   // día 1 (mismo día)
  ok("Con 2 aciertos el MISMO día NO llega a Dominado (falta espaciado)", a.state !== "mastered");
  a = P.applyAttempt(a, { correct: true }, "2026-07-31");   // día 2
  ok("Con 3 aciertos en 2 días distintos -> Dominado", a.state === "mastered");

  // 3) Fallar estando Dominado -> Necesita repaso, y repaso vuelve a 1 día
  let b = P.applyAttempt(a, { correct: false }, "2026-08-05");
  ok("Fallar estando 'mastered' -> 'needs_review'", b.state === "needs_review");
  ok("Al fallar, el próximo repaso vuelve a +1 día", b.next_review_at === "2026-08-06");

  // 4) Nunca 'suspende': un fallo desde practicing sigue en practicing
  let c = P.applyAttempt(P.blank("o4"), { correct: false }, "2026-07-30");
  ok("Un fallo no 'suspende' (queda en 'practicing')", c.state === "practicing");

  // 5) Repaso espaciado 1·3·7·16 al encadenar aciertos
  let s = P.blank("o5");
  s = P.applyAttempt(s, { correct: true }, "2026-07-30"); ok("Repaso tras 1º acierto = +1 día", s.next_review_at === "2026-07-31");
  s = P.applyAttempt(s, { correct: true }, "2026-07-30"); ok("Repaso tras 2º acierto = +3 días", s.next_review_at === "2026-08-02");
  s = P.applyAttempt(s, { correct: true }, "2026-07-30"); ok("Repaso tras 3º acierto = +7 días", s.next_review_at === "2026-08-06");
  s = P.applyAttempt(s, { correct: true }, "2026-07-30"); ok("Repaso tras 4º acierto = +16 días", s.next_review_at === "2026-08-15");
  s = P.applyAttempt(s, { correct: true }, "2026-07-30"); ok("Repaso se mantiene en +16 (tope)", s.next_review_at === "2026-08-15");

  // 6) Producir pesa más que reconocer
  let r1 = P.applyAttempt(P.blank("o6a"), { correct: true, production: false }, "2026-07-30");
  let r2 = P.applyAttempt(P.blank("o6b"), { correct: true, production: true }, "2026-07-30");
  ok("Producir suma más evidencia que reconocer", r2.evidence > r1.evidence);

  // 7) Composición de la sesión: prioriza errores y repasos que vencen, intercala habilidades
  const objectives = [
    { id: "voc1", skill_id: "vocabulary", prerequisites: [] },
    { id: "gra1", skill_id: "grammar", prerequisites: [] },
    { id: "lis1", skill_id: "listening", prerequisites: [] },
    { id: "new1", skill_id: "reading", prerequisites: [] }
  ];
  const mById = {
    voc1: Object.assign(P.blank("voc1"), { state: "needs_review", last_result: "incorrect", next_review_at: "2026-07-30" }),
    gra1: Object.assign(P.blank("gra1"), { state: "mastered", next_review_at: "2026-07-30" }), // vence
    lis1: Object.assign(P.blank("lis1"), { state: "practicing", next_review_at: "2026-07-30" }),
    new1: P.blank("new1") // nuevo
  };
  const sess = P.composeSession(objectives, mById, "2026-07-30", { size: 6 });
  ok("La sesión incluye el error pendiente (voc1)", sess.indexOf("voc1") !== -1);
  ok("El error pendiente va el primero (máxima prioridad)", sess[0] === "voc1");
  ok("La sesión incluye 1 concepto nuevo con prereqs cubiertos", sess.indexOf("new1") !== -1);
  ok("Un objetivo 'mastered' que NO vence no entra", (function(){
     const m2 = { gra1: Object.assign(P.blank("gra1"), { state:"mastered", next_review_at:"2026-12-01" }) };
     const s2 = P.composeSession([{id:"gra1",skill_id:"grammar",prerequisites:[]}], m2, "2026-07-30", {size:6});
     return s2.indexOf("gra1") === -1;
  })());

  // 8) Prerrequisitos: un nuevo con prereq NO cubierto no entra
  const objs2 = [{ id: "adv", skill_id: "grammar", prerequisites: ["base"] }];
  const s3 = P.composeSession(objs2, {}, "2026-07-30", { size: 6 });
  ok("Un concepto nuevo con prerrequisito sin cubrir NO se propone", s3.indexOf("adv") === -1);

  const sm = document.getElementById("summary");
  sm.textContent = `${pass} pruebas OK · ${fail} fallidas`;
  sm.className = fail ? "fail" : "pass";
  window.__RESULT__ = { pass, fail };
</script>
</body>
</html>
