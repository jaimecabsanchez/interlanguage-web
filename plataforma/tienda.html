<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda · Interlanguage HOME</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../images/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="shell.css">
<style>
  .shop-hd{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px;}
  .shop-hd h1{font-size:1.4rem;color:var(--navy);}
  .bal{display:inline-flex;align-items:center;gap:6px;background:var(--jade-tint);color:var(--jade-deep);font-family:var(--font-display);font-weight:800;font-size:1.1rem;padding:8px 18px;border-radius:100px;margin-top:8px;}
  .avatar-preview{width:110px;height:110px;border-radius:30px;background:linear-gradient(150deg,var(--coral),var(--coral-deep));display:grid;place-items:center;font-size:3.6rem;margin:16px auto 4px;box-shadow:0 16px 30px -14px var(--coral);position:relative;}
  .avatar-preview .hat{position:absolute;top:-14px;font-size:2rem;}
  .avatar-preview .acc{position:absolute;bottom:10px;right:8px;font-size:1.6rem;}
  .equipped-note{text-align:center;color:var(--soft);font-size:.82rem;min-height:1.2em;margin-bottom:6px;}
  .cat{font-family:var(--font-display);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:18px 2px 10px;}
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .item .ico{font-size:2.4rem;line-height:1;}
  .item .nm{font-family:var(--font-display);font-weight:700;color:var(--navy);font-size:.92rem;}
  .item .price{color:var(--jade-deep);font-weight:800;font-size:.9rem;}
  .buy{margin-top:4px;width:100%;border:none;border-radius:12px;padding:10px;font-family:var(--font-display);font-weight:800;font-size:.86rem;background:var(--coral);color:#fff;box-shadow:0 8px 16px -8px var(--coral);}
  .buy:disabled{background:var(--surface-2);color:var(--faint);box-shadow:none;}
  .item.owned .buy{background:var(--jade-tint);color:var(--jade-deep);box-shadow:none;}
  .item.owned{border-color:var(--jade);}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;opacity:0;transition:opacity .2s ease;z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app" class="hidden app-with-rail">
  <div class="shell">
    <aside class="rail" aria-label="Navegación principal">
      <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11 21 3l-7 18-3-7-8-3Z"/></svg></span><span>Inter<b>language</b></span></div>
      <nav>
        <a href="inicio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h4v-5h4v5h4v-9"/></svg><span>Inicio</span></a>
        <a href="leccion.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg><span>Practicar</span></a>
        <a href="progreso.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 3.5-4 3 2.5L20 7"/></svg><span>Progreso</span></a>
        <a class="is-active" href="perfil.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>Perfil</span></a>
      </nav>
    </aside>
    <div class="shell-main">
  <div class="app-top">
    <span class="chip-stat streak">🔥 12</span>
    <span class="chip-stat coins">💎 <span id="topGems">240</span></span>
  </div>

  <div class="app-shell">
    <div class="shop-hd">
      <h1>Tienda</h1>
      <span class="bal">💎 <span id="gems">240</span> gemas</span>
      <div class="avatar-preview" id="avatar">🦊<span class="hat" id="hat"></span><span class="acc" id="acc"></span></div>
      <div class="equipped-note" id="note">Gana gemas practicando y personaliza a tu zorro</div>
    </div>

    <div class="cat">🛡️ Protege tu racha</div>
    <div class="shop-grid" id="grid-extra"></div>
    <div class="cat">🎩 Ropa y complementos</div>
    <div class="shop-grid" id="grid-ropa"></div>
    <div class="cat">🐾 Mascotas</div>
    <div class="shop-grid" id="grid-mascota"></div>
  </div>
    </div><!-- /.shell-main -->
  </div><!-- /.shell -->

  <div class="toast" id="toast"></div>

  <nav class="app-nav" aria-label="Navegación principal">
    <a class="app-nav__item" href="inicio.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h4v-5h4v5h4v-9"/></svg>
      <span class="app-nav__label">Inicio</span>
    </a>
    <a class="app-nav__item" href="leccion.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>
      <span class="app-nav__label">Practicar</span>
    </a>
    <a class="app-nav__item" href="progreso.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 3.5-4 3 2.5L20 7"/></svg>
      <span class="app-nav__label">Progreso</span>
    </a>
    <a class="app-nav__item is-active" href="perfil.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span class="app-nav__label">Perfil</span>
    </a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let gems = 0;
  let owned = [];

  const items = [
    { id:"shield", cat:"extra", ico:"🛡️", nm:"Escudo de racha", price:200, slot:null, desc:"protege tu racha un día" },
    { id:"double", cat:"extra", ico:"⚡", nm:"XP doble (1 día)", price:150, slot:null },
    { id:"hat",    cat:"ropa", ico:"🎩", nm:"Sombrero de mago", price:150, slot:"hat" },
    { id:"glass",  cat:"ropa", ico:"🕶️", nm:"Gafas de sol", price:120, slot:"acc" },
    { id:"cape",   cat:"ropa", ico:"🦸", nm:"Capa de héroe", price:300, slot:"hat" },
    { id:"crown",  cat:"ropa", ico:"👑", nm:"Corona dorada", price:450, slot:"hat" },
    { id:"cat",    cat:"mascota", ico:"🐱", nm:"Gatito", price:250, slot:"acc" },
    { id:"dragon", cat:"mascota", ico:"🐲", nm:"Dragón bebé", price:500, slot:"acc" }
  ];

  function render() {
    $("gems").textContent = gems; $("topGems").textContent = gems;
    ["extra","ropa","mascota"].forEach(cat => {
      $("grid-" + cat).innerHTML = items.filter(i => i.cat === cat).map(i => {
        const has = owned.includes(i.id);
        const can = gems >= i.price;
        return `<div class="item ${has ? "owned" : ""}">
          <div class="ico">${i.ico}</div>
          <div class="nm">${i.nm}</div>
          <div class="price">${has ? "" : "💎 " + i.price}</div>
          <button class="buy" data-id="${i.id}" ${has || can ? "" : "disabled"}>
            ${has ? (i.slot ? "Equipar" : "Comprado ✓") : (can ? "Comprar" : "Sin gemas")}
          </button></div>`;
      }).join("");
    });
    document.querySelectorAll(".buy").forEach(b => b.onclick = () => act(b.dataset.id));
  }

  async function act(id) {
    const it = items.find(x => x.id === id);
    if (owned.includes(id)) { equip(it); return; }
    const r = await ILAuth.buyItem(id, it.price);
    if (!r.ok) { toast("Te faltan " + r.short + " gemas 💎"); return; }
    gems = r.gems; owned = r.owned;
    toast("¡" + it.nm + " comprado! 🎉");
    if (it.slot) equip(it); else render();
  }

  async function equip(it) {
    if (it.slot === "hat") { $("hat").textContent = it.ico; await ILAuth.equipItem("hat", it.ico); }
    if (it.slot === "acc") { $("acc").textContent = it.ico; await ILAuth.equipItem("acc", it.ico); }
    if (it.slot) $("note").textContent = "¡" + it.nm + " equipado! 😎";
    render();
  }

  let tT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 1600); }

  (async () => {
    const p = await ILAuth.getProfile();
    if (!p) { location.href = "index.html"; return; }
    if (p.is_admin) { location.href = "admin.html"; return; }
    const pr = await ILAuth.getProgress();
    if (pr) { gems = pr.gems; owned = pr.owned || []; if (pr.hat) $("hat").textContent = pr.hat; if (pr.acc) $("acc").textContent = pr.acc; }
    $("app").classList.remove("hidden");
    render();
  })();
</script>
</body>
</html>
