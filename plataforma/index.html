<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Interlanguage HOME</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../images/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="demoBanner" class="demo-banner hidden">🧪 <b>Modo demo</b> · prueba con usuario <b>lucia</b> / contraseña <b>home1234</b> (o <b>admin</b> / <b>admin1234</b>)</div>

<div class="auth-wrap">
  <form class="auth-card" id="loginForm" autocomplete="on">
    <div class="brand-mark">
      <div class="brand-fox">🦊</div>
      <div class="brand-name">Interlanguage <span>HOME</span></div>
    </div>
    <h1>¡Hola de nuevo!</h1>
    <p class="sub">Entra para seguir tu racha 🔥</p>

    <div class="msg error" id="msg"></div>

    <div class="field">
      <label for="username">Usuario</label>
      <div class="inp"><input type="text" id="username" name="username" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="tu usuario"></div>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="inp">
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="tu contraseña">
        <button type="button" class="toggle-eye" id="eye" aria-label="Mostrar contraseña">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Entrar</button>
    <p class="auth-foot">¿Olvidaste tu contraseña? Pídesela a tu profe de Interlanguage.</p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  if (ILAuth.isDemo()) $("demoBanner").classList.remove("hidden");

  function routeFor(p) {
    if (p.is_admin) return "admin.html";
    if (p.must_change_password) return "cambiar-clave.html";
    return "inicio.html";
  }

  // si ya hay sesión, entra directo
  (async () => { const p = await ILAuth.getProfile(); if (p) location.href = routeFor(p); })();

  $("eye").addEventListener("click", () => {
    const i = $("password"); i.type = i.type === "password" ? "text" : "password";
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"); msg.classList.remove("show");
    const btn = $("submitBtn"); btn.disabled = true; const old = btn.textContent; btn.textContent = "Entrando…";
    const res = await ILAuth.signIn($("username").value, $("password").value);
    if (!res.ok) {
      msg.textContent = res.error; msg.classList.add("show");
      btn.disabled = false; btn.textContent = old;
      return;
    }
    location.href = routeFor(res.profile);
  });
</script>
</body>
</html>
