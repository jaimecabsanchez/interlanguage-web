<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión · Interlanguage</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css?v=20260809b">
<link rel="stylesheet" href="app.css?v=20260809b">
<link rel="stylesheet" href="motor/motor.css?v=20260809b">
<link rel="stylesheet" href="etapa.css?v=20260809b">
<style>
  body{background:
    radial-gradient(120% 40% at 100% 0%, #FDECE4 0%, transparent 55%),
    radial-gradient(120% 40% at 0% 4%, #EAF3EE 0%, transparent 50%),
    #FBF9F5;}
  .lesson{background:transparent}
  .lesson{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
  .lesson-top{display:flex;align-items:center;gap:14px;padding:18px 2px 10px}
  .close{background:none;border:none;font-size:1.4rem;color:#8A97A6;cursor:pointer;line-height:1}
  .progress{flex:1;height:12px;border-radius:10px;background:#eef1f4;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF6B4A,#E14F30);transition:width .3s}
  .hearts{color:#E14F30;font-weight:800;font-size:.95rem}
  #stage{flex:1;padding:16px 2px 30px}
  /* recompensa */
  .reward{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50;
    background:radial-gradient(90% 55% at 50% 30%, #FFF3EC 0%, transparent 60%), radial-gradient(80% 50% at 50% 90%, #EAF3EE 0%, transparent 60%), #FBF9F5;}
  .reward .medal{position:relative;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#E7F1EC);display:grid;place-items:center;font-size:3.6rem;margin-bottom:10px;animation:pop .5s ease;box-shadow:0 20px 40px -20px rgba(22,41,74,.3)}
  .reward .medal::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid var(--coral);opacity:0;animation:ring .8s cubic-bezier(.2,.7,.3,1) .15s both}
  @keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.25);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .reward .medal::before{animation:none} }
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.reward .medal{animation:none}}
  .reward h1{font-size:2rem;color:#16294A;margin:6px 0;font-family:'Plus Jakarta Sans'}
  .reward p{color:#5C6B7A;margin:0 0 22px}
  .reward-stats{display:flex;gap:12px;margin-bottom:28px}
  .rw{background:#fff;border:1px solid #E4E8EE;border-radius:16px;padding:14px 20px}
  .rw .v{font-family:'Plus Jakarta Sans';font-weight:800;font-size:1.4rem;color:#16294A}
  .rw .l{font-size:.72rem;color:#8A97A6;text-transform:uppercase;letter-spacing:.04em}
  .hidden{display:none!important}
  /* Banda temática de la unidad (acento por tema; se atenúa en ESO) */
  .theme-bar{display:flex;align-items:center;gap:8px;padding:0 2px 10px;color:var(--tb-color,#5C6B7A);font-weight:700;font-size:.9rem;}
  .theme-bar[hidden]{display:none;}
  .theme-bar .tb-ico{font-size:1.15rem;}
  body[data-stage="eso"] .theme-bar{color:#5C6B7A;font-weight:600;font-size:.82rem;}
  body[data-stage="eso"] .theme-bar .tb-ico{display:none;}
  /* Reacción breve de Nemo al acertar */
  .nemo-react{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) scale(0);font-size:3.2rem;z-index:60;
    pointer-events:none;filter:drop-shadow(0 10px 16px rgba(22,41,74,.22));}
  .nemo-react.show{animation:nemoPop .9s ease forwards;}
  @keyframes nemoPop{0%{transform:translateX(-50%) scale(0) rotate(-8deg);}
    30%{transform:translateX(-50%) scale(1.12) rotate(5deg);}
    60%{transform:translateX(-50%) scale(1) rotate(0);opacity:1;}
    100%{transform:translateX(-50%) scale(.9) translateY(18px);opacity:0;}}
  body[data-stage="eso"] .nemo-react{font-size:2.1rem;bottom:76px;}
  @media (prefers-reduced-motion:reduce){ .nemo-react.show{animation:none;opacity:0;} }
  .new-medals{background:#FFF7E6;border:1px solid #FFE2A8;border-radius:16px;padding:14px 18px;margin-bottom:20px;max-width:340px}
  .nm-title{font-family:'Plus Jakarta Sans';font-weight:800;color:#B8860B;margin-bottom:8px}
  .nm{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #FFE2A8;border-radius:999px;padding:6px 12px;margin:3px;font-size:.9rem;font-weight:600;color:#7a5a10}
  .nm-ico{font-size:1.1rem}
</style>
</head>
<body>
<div class="il-offline" id="offline" hidden>📶 Sin conexión — tus respuestas se guardarán al volver la red.</div>
<div class="lesson">
  <div class="lesson-top">
    <button class="close" id="close" aria-label="Salir">✕</button>
    <div class="progress"><i id="pfill"></i></div>
    <span class="hearts" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2c1 3-1 4.5-1 6.5A2.5 2.5 0 0 0 13.5 11c1.7 0 2.6-1.2 2.7-2.4C18 10 19 12.4 19 15a7 7 0 1 1-14 0c0-3.3 2-5.6 3.4-7.5C10.2 5.3 11.6 4 12 2Z"/></svg></span>
  </div>
  <div class="theme-bar" id="themeBar" hidden>
    <span class="tb-ico" aria-hidden="true"></span><span class="tb-title"></span>
  </div>
  <div id="stage"></div>
</div>

<div class="nemo-react" id="nemoReact" aria-hidden="true">🦊</div>

<div class="reward hidden" id="reward">
  <div class="medal" aria-hidden="true">🦊</div>
  <h1>¡Misión completada!</h1>
  <p id="rwMsg">Has mantenido tu racha un día más 🔥</p>
  <div class="reward-stats">
    <div class="rw"><div class="v" id="rwScore">–</div><div class="l">Aciertos</div></div>
    <div class="rw"><div class="v" id="rwStreak">🔥 –</div><div class="l">Racha</div></div>
    <div class="rw"><div class="v">+20</div><div class="l">Gemas</div></div>
  </div>
  <div id="rwMedals"></div>
  <a href="inicio.html" class="btn btn-primary" style="max-width:320px;text-decoration:none;display:block;">VOLVER AL MAPA</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260809b"></script>
<script src="auth-utils.js?v=20260809b"></script>
<script src="etapa.js?v=20260809b"></script>
<script src="auth.js?v=20260809b"></script>
<script src="contenido.js?v=20260809b"></script>
<script src="motor/motivacion.js?v=20260809b"></script>
<script src="motor/matriz.js?v=20260809b"></script>
<script src="motor/engine.js?v=20260809b"></script>
<script>
  const $ = (id) => document.getElementById(id);

  function refreshOffline() { $("offline").hidden = navigator.onLine; }
  window.addEventListener("online", refreshOffline);
  window.addEventListener("offline", refreshOffline);
  refreshOffline();

  function stateCard(ic, title, text) {
    $("stage").innerHTML = '<div class="il-state"><div class="ic">' + ic + '</div><h2>' + title +
      '</h2><p>' + text + '</p><a class="btn btn-ghost" href="inicio.html">Volver</a></div>';
  }

  (async () => {
    try {
      // Guard: solo alumnos con la contraseña ya cambiada
      const p = await ILAuth.getProfile();
      if (!p) { location.href = "index.html"; return; }
      if (p.is_admin) { location.href = "admin.html"; return; }
      if (p.must_change_password) { location.href = "cambiar-clave.html"; return; }
      IL_ETAPA.apply(p);
      _user = p.username || "";
      const pl = await ILAuth.getPlacement();
      start(pl.cefr);
    } catch (e) {
      stateCard("😕", "No hemos podido cargar la sesión", "Revisa tu conexión e inténtalo de nuevo.");
    }
  })();

  // La sesión se compone según DOS filtros: la banda por edad (matriz) y el NIVEL del alumno
  // (test de colocación). Se prioriza su nivel y el inmediatamente inferior; lo de más nivel
  // queda al final (así a un peque no le caen ejercicios difíciles y a un mayor no le caen fáciles).
  const CEFR_IDX = { "Pre-A1": 0, "A1": 1, "A2": 2, "B1": 3 };
  let items = [], idx = 0, correct = 0, curStreak = 0, maxStreak = 0, _user = "";

  // --- Variedad diaria: baraja estable por día + evita lo de la sesión anterior ---
  const todayStr = () => new Date().toISOString().slice(0, 10);
  function hashStr(s) { let h = 0; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function seededRand(n) { n = (n ^ 0x9E3779B9) >>> 0; n = Math.imul(n ^ (n >>> 15), 1 | n); n ^= n + Math.imul(n ^ (n >>> 7), 61 | n); return ((n ^ (n >>> 14)) >>> 0) / 4294967296; }

  // Mapa ejercicio -> unidad (para el tema de cada actividad)
  const _unitOf = {};
  (window.IL_CONTENIDO.unidades || []).forEach(u => (u.ejercicios || []).forEach(e => { _unitOf[e.id] = u; }));

  function updateTheme() {
    const u = _unitOf[items[idx] && items[idx].id];
    const tb = $("themeBar");
    if (u && u.tema) {
      tb.hidden = false;
      tb.style.setProperty("--tb-color", u.tema.color || "#5C6B7A");
      tb.querySelector(".tb-ico").textContent = u.tema.icono || "";
      tb.querySelector(".tb-title").textContent = u.titulo || "";
    } else { tb.hidden = true; }
  }

  // Reacción breve de Nemo al acertar (sobria; se atenúa/oculta con reduced-motion)
  function nemoCheer() {
    const n = $("nemoReact");
    n.classList.remove("show"); void n.offsetWidth; n.classList.add("show");
  }

  function composeByLevel(banda, cefr) {
    const all = (window.IL_CONTENIDO.unidades || []).flatMap(u => u.ejercicios || []);
    let pool = window.IL_MATRIZ ? IL_MATRIZ.filtra(all, banda) : all.slice();
    const byId = {}; all.forEach(e => { byId[e.id] = e; });

    // Sesión del día cacheada: la misma durante todo el día (coherente si recarga)
    const skey = "il_session_" + _user;
    let cached = null; try { cached = JSON.parse(localStorage.getItem(skey)); } catch (e) {}
    if (cached && cached.date === todayStr() && Array.isArray(cached.ids)) {
      const its = cached.ids.map(id => byId[id]).filter(Boolean);
      if (its.length) return its;
    }
    const prevIds = (cached && Array.isArray(cached.ids)) ? cached.ids : [];  // lo de la sesión anterior

    const target = (CEFR_IDX[cefr] != null) ? CEFR_IDX[cefr] : 1;   // sin nivel: por defecto A1
    const seed = hashStr(_user + "|" + todayStr());
    const scored = pool.map(e => {
      const li = (CEFR_IDX[e.nivel] != null) ? CEFR_IDX[e.nivel] : 0;
      const score = (li > target) ? (100 + (li - target)) : (target - li); // 0 = tu nivel exacto
      const recent = prevIds.indexOf(e.id) !== -1 ? 1 : 0;           // penaliza lo del día anterior
      const rnd = seededRand(seed + hashStr(e.id));                  // baraja estable del día
      return { e: e, score: score, recent: recent, rnd: rnd };
    }).sort((a, b) => (a.score - b.score) || (a.recent - b.recent) || (a.rnd - b.rnd));

    // Intercala habilidades y coge hasta 6
    const picked = []; let lastSkill = null; const rest = scored.slice();
    while (rest.length && picked.length < 6) {
      let k = rest.findIndex(x => x.e.habilidad !== lastSkill);
      if (k === -1) k = 0;
      const x = rest.splice(k, 1)[0]; picked.push(x.e); lastSkill = x.e.habilidad;
    }
    try { localStorage.setItem(skey, JSON.stringify({ date: todayStr(), ids: picked.map(e => e.id) })); } catch (e) {}
    return picked;
  }

  function start(cefr) {
    const banda = document.body.dataset.stage || "p56";
    items = composeByLevel(banda, cefr);
    if (!items.length) { stateCard("📭", "Contenido no disponible", "Todavía no hay ejercicios para tu nivel hoy. Vuelve pronto."); return; }
    show();
  }
  function setProgress() { $("pfill").style.width = Math.round(idx / items.length * 100) + "%"; }

  function show() {
    setProgress();
    updateTheme();
    const ctrl = IL_ENGINE.render($("stage"), items[idx], {
      lastOne: idx === items.length - 1,
      onResult: (ev) => {
        if (ev.correct) { correct++; curStreak++; if (curStreak > maxStreak) maxStreak = curStreak; nemoCheer(); }
        else { curStreak = 0; }
      },
      onNext: () => { idx++; if (idx < items.length) show(); else finish(); }
    });
    ctrl.focus();
  }

  async function finish() {
    $("pfill").style.width = "100%";
    $("rwScore").textContent = correct + "/" + items.length;
    const summary = { correct: correct, total: items.length, allCorrect: correct === items.length, maxCorrectStreak: maxStreak };
    try {
      const r = await ILAuth.completeLesson(summary);
      if (r) {
        $("rwStreak").textContent = "🔥 " + r.streak;
        if (r.newMedals && r.newMedals.length) {
          $("rwMedals").innerHTML = '<div class="new-medals"><div class="nm-title">¡Medalla' +
            (r.newMedals.length > 1 ? "s" : "") + ' nueva' + (r.newMedals.length > 1 ? "s" : "") + '!</div>' +
            r.newMedals.map(m => '<span class="nm"><span class="nm-ico">' + m.icon + '</span>' + m.name + '</span>').join("") + '</div>';
        }
      }
    } catch (e) {}
    $("reward").classList.remove("hidden");
  }

  $("close").onclick = () => { location.href = "inicio.html"; };
</script>
</body>
</html>
