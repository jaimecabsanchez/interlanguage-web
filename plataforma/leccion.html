<style>
  body{background:var(--il-background);min-height:100dvh}
  .lesson{width:100%;max-width:1040px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:0 var(--il-space-4)}
  .lesson-header{position:relative;padding:var(--il-space-4) 0 var(--il-space-3);border-bottom:1px solid var(--il-border)}
  .lesson-header__top{display:grid;grid-template-columns:var(--il-touch) minmax(0,1fr);align-items:center;gap:var(--il-space-3)}
  .lesson-close{width:var(--il-touch);height:var(--il-touch);display:grid;place-items:center;padding:0;border:1px solid var(--il-border);border-radius:50%;background:var(--il-surface);color:var(--il-text-secondary)}
  .lesson-close:hover{background:var(--il-primary-soft);color:var(--il-primary);border-color:var(--il-border-strong)}
  .lesson-close svg{width:20px;height:20px}
  .lesson-meta{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:var(--il-space-3)}.lesson-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--il-font-display);font-size:var(--il-fs-sm);font-weight:var(--il-weight-bold);color:var(--il-text-secondary)}
  .lesson-step{display:block;margin:0;font-size:var(--il-fs-xs);font-weight:var(--il-weight-bold);color:var(--il-text-secondary);font-variant-numeric:tabular-nums}
  .lesson-streak{min-height:var(--il-touch);display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--il-radius-pill);background:var(--il-surface);border:1px solid var(--il-border);color:var(--il-warning);font-family:var(--il-font-display);font-weight:var(--il-weight-extrabold);font-size:var(--il-fs-sm)}
  .lesson-streak svg{width:17px;height:17px}
  .segment-progress{position:relative;margin-top:var(--il-space-3)}
  .segment-track{display:grid;grid-template-columns:repeat(var(--segment-count),minmax(0,1fr));gap:6px;height:8px}
  .segment{height:8px;border-radius:var(--il-radius-pill);background:var(--il-border);transition:background-color var(--il-transition-base),transform var(--il-transition-base)}
  .segment.is-complete{background:var(--il-success)}.segment.is-current{background:var(--il-primary);transform:scaleY(1.25)}
  .progress-plane{position:absolute;top:-7px;left:var(--plane-progress);width:24px;height:24px;color:var(--il-secondary);transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(var(--il-shadow-xs));transition:left var(--il-duration-slow) var(--il-ease)}
  .progress-plane svg{width:24px;height:24px}
  body[data-stage="p12"]{background:var(--il-background)}
  body[data-stage="p12"] .lesson{max-width:1040px}
  body[data-stage="p12"] .lesson-header{border-bottom:0}
  body[data-stage="p12"] .lesson-step{font-size:var(--il-fs-sm);font-weight:var(--il-weight-bold);color:var(--il-primary)}
  body[data-stage="p12"] .segment-track{position:relative;height:40px;align-items:center;gap:var(--il-space-2);background:linear-gradient(var(--il-border),var(--il-border)) center/88% 4px no-repeat}
  body[data-stage="p12"] .segment{position:relative;z-index:1;width:38px;height:38px;display:grid;place-items:center;justify-self:center;border:2px solid var(--il-border);border-radius:50%;background:var(--il-surface);color:var(--il-text-secondary);font-family:var(--il-font-display);font-size:var(--il-fs-xs);font-weight:var(--il-weight-extrabold);box-shadow:0 0 0 4px var(--il-surface)}
  body[data-stage="p12"] .segment::after{content:attr(data-step)}body[data-stage="p12"] .segment.is-current{border-color:var(--il-primary);background:var(--il-primary);color:var(--il-on-primary);transform:scale(1.05)}body[data-stage="p12"] .segment.is-complete{border-color:var(--il-success);background:var(--il-success);color:var(--il-on-success)}
  body[data-stage="p34"] .lesson-step{font-weight:var(--il-weight-bold);color:var(--il-primary)}
  body[data-stage="eso"]{background:var(--il-background)}
  body[data-stage="eso"] .lesson{max-width:1040px}
  body[data-stage="eso"] .lesson-header{padding-top:var(--il-space-5);border-color:var(--il-border-strong)}
  body[data-stage="eso"] .lesson-close{border-radius:var(--il-radius-xs);box-shadow:none}
  body[data-stage="eso"] .lesson-streak{border-radius:var(--il-radius-xs);background:var(--il-surface-secondary);box-shadow:none}
  body[data-stage="eso"] .segment-progress{margin-top:var(--il-space-3);padding-top:0}
  body[data-stage="eso"] .segment-track{height:5px;gap:4px}
  body[data-stage="eso"] .segment{height:5px;border-radius:2px}
  body[data-stage="eso"] .progress-plane{top:-8px;width:20px;height:20px;filter:none}
  body[data-stage="eso"] .progress-plane svg{width:20px;height:20px}
  body[data-stage="eso"] .theme-line{padding-top:var(--il-space-2);font-size:var(--il-fs-xs)}
  #stage{flex:1;width:100%;display:flex;align-items:flex-start;padding:var(--il-space-5) 0 0}
  .theme-line{display:flex;align-items:center;gap:var(--il-space-2);padding:var(--il-space-3) 0 0;color:var(--il-text-secondary);font-size:var(--il-fs-sm);font-weight:var(--il-weight-semibold)}
  .theme-line svg{width:18px;height:18px}.theme-line[hidden]{display:none}
  .success-react{position:fixed;left:50%;bottom:96px;width:52px;height:52px;display:grid;place-items:center;border-radius:var(--il-radius-md);background:var(--il-primary);color:var(--il-on-primary);opacity:0;transform:translateX(-50%) scale(.7);pointer-events:none;z-index:var(--il-z-overlay)}
  .success-react svg{width:26px;height:26px}.success-react.is-visible{animation:lesson-cheer 850ms var(--il-ease) both}
  @keyframes lesson-cheer{0%{opacity:0;transform:translateX(-50%) scale(.7) rotate(-7deg)}25%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(4deg)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(14px) scale(.92)}}

  .exit-dialog{width:min(92vw,440px);padding:0;border:0;border-radius:var(--il-radius-xl);background:var(--il-surface);color:var(--il-text-primary);box-shadow:var(--il-shadow-lg)}
  .exit-dialog::backdrop{background:var(--il-overlay);backdrop-filter:blur(3px)}
  .exit-dialog__body{padding:var(--il-space-6)}.exit-dialog__icon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:var(--il-space-4);border-radius:var(--il-radius-md);background:var(--il-secondary-soft);color:var(--il-secondary)}
  .exit-dialog__icon svg{width:27px;height:27px}.exit-dialog h2{font-size:var(--il-fs-xl);margin-bottom:var(--il-space-2)}.exit-dialog p{color:var(--il-text-secondary)}
  .exit-dialog__actions{display:flex;flex-direction:column;gap:var(--il-space-2);margin-top:var(--il-space-5)}


  @media (max-width:520px){
    .lesson{padding-inline:var(--il-space-3)}.lesson-header__top{grid-template-columns:var(--il-touch) minmax(0,1fr)}.lesson-streak{display:none}
    #stage{padding-top:var(--il-space-3)}
  }
  body[data-stage="p56"] .segment-track,body[data-stage="eso"] .segment-track{gap:0;overflow:hidden;border-radius:var(--il-radius-pill);background:var(--il-border)}
  body[data-stage="p56"] .segment,body[data-stage="eso"] .segment{border-radius:0;background:transparent}
  body[data-stage="p56"] .segment.is-complete,body[data-stage="p56"] .segment.is-current,body[data-stage="eso"] .segment.is-complete,body[data-stage="eso"] .segment.is-current{background:var(--il-primary)}
  body.lesson-page:has(.age-mode-switcher) .lesson-header{padding-right:250px}
  @media (max-width:620px){body.lesson-page:has(.age-mode-switcher) .lesson-header{padding-right:0}.lesson-name{display:none}.lesson-meta{justify-content:flex-start}}
  @media (min-width:1024px){.lesson{max-width:1040px;padding-inline:var(--il-space-6)}.lesson-header{padding-top:var(--il-space-5)}}
  @media (prefers-reduced-motion:reduce){.segment,.progress-plane{transition:none}.success-react.is-visible{animation:none}}
</style>

      <button class="lesson-close" id="closeMission" type="button" aria-label="Salir de la misión"><span data-il-icon="close"></span></button>

        <span class="lesson-name" id="missionName">Tu misión de hoy</span>

<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const reviewMode = params.get("mode") === "errors";
  const bonusMode = params.get("mode") === "bonus";
  const reviewDueMode = params.get("mode") === "review";
  const examMode = params.get("mode") === "exam"; // examen periódico (repaso acumulativo)
  const skillMode = params.get("mode") === "skill";
  const requestedSkill = params.get("skill") || "";
  const extraMode = () => bonusMode || reviewDueMode || examMode || skillMode; // no tocan la misión diaria
  let units = [];
  const byId = {}, unitOf = {};

  let username = "";
  let stageName = "neutral";
  let ageExperience = IL_ETAPA.config("neutral");
  let exerciseExperience = IL_ETAPA.exerciseConfig("neutral");
  let items = [];
  let dailyItems = [];
  let index = 0;
  let currentController = null;
  let pendingResult = null;
  let reviewCorrect = 0;
  let reviewResolved = [];
  let bonusCorrect = 0;
  let bonusPool = [];
  let missionMeta = {};
  let completionProgress = null;
  let newAchievements = [];
  let adaptiveState = IL_ADAPTACION.create();
  let placementState = null;
  let learningEvents = [];
  let practiceSession = { id:null, client_session_key:"" };
  let dueAtStart = [];

  function modeName() { return reviewMode || reviewDueMode ? "review" : (extraMode() ? "extra" : "daily"); }
  function recordLearning(raw) {
    const exercise = items[index] || {};
    const event = IL_LearningEvents.create(Object.assign({}, raw, {
      session_id:practiceSession && practiceSession.id,
      client_session_key:practiceSession && practiceSession.client_session_key,
      exercise_id:exercise.id || raw.exercise_id,
      objective_id:exercise.objective_id || "",
      variant_id:exercise.variant_group || "",
      age_band:stageName, cefr:(placementState && placementState.cefr) || exercise.nivel || "",
      skill:exercise.habilidad || "", content_version:exercise.content_version || "1", mode:modeName()
    }));
    learningEvents.push(event);
    Promise.resolve(ILAuth.recordLearningEvent(event)).catch(error => {
      if (window.ILObservability) ILObservability.report("network_failure", error, { area:"lesson", operation:"record_attempt", exercise_id:event.exercise_id });
    });
    if (!event.technical_failure && event.assessment !== 'self_report' && window.ILMastery && exercise.id) {
      const card = ILMastery.recordEvent(username, exercise.id, exercise.tipo, event, missionMeta && missionMeta.date);
      Promise.resolve(ILAuth.saveExerciseMastery({ exercise_key:exercise.id, objective_key:exercise.objective_id || "", skill:exercise.habilidad || "", card })).catch(error => {
        if (window.ILObservability) ILObservability.report("network_failure", error, { area:"lesson", operation:"save_mastery", exercise_id:exercise.id });
      });
    }
    return event;
  }

  function refreshOffline() { $("offline").hidden = navigator.onLine; }
  addEventListener("online", refreshOffline); addEventListener("offline", refreshOffline); refreshOffline();

  function missionTitle(unit) {
    return ILCopy.missionTitle(unit, stageName);
  }

  function errorState(title, text, action) {
    action = action || {};
    const href = action.href || "inicio.html";
    const label = action.label || "Volver al inicio";
    $("stage").innerHTML = '<div class="il-state"><div class="ic">' + ILIcon("warning") + "</div><h2></h2><p></p><a class=\"btn btn-ghost\"></a></div>";
    $("stage").querySelector("h2").textContent = title;
    $("stage").querySelector("p").textContent = text;
    const link = $("stage").querySelector("a"); link.href = href; link.textContent = label;
  }

  function updateHeader() {
    const total = items.length || 1;
    const current = Math.min(index + 1, total);
    $("exerciseCount").textContent = current + " / " + total;
    const progress = $("segmentProgress");
    progress.setAttribute("aria-valuemax", total); progress.setAttribute("aria-valuenow", Math.min(index, total));
    progress.setAttribute("aria-label", ageExperience.id === "secondary"
      ? index + " of " + total + " exercises complete"
      : index + " de " + total + " ejercicios completados");
    const track = $("segmentTrack"); track.style.setProperty("--segment-count", total); track.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const segment = document.createElement("span");
      segment.className = "segment" + (i < index ? " is-complete" : (i === index ? " is-current" : ""));
      segment.dataset.step = String(i + 1);
      if (i === index) segment.setAttribute("aria-current", "step");
      segment.setAttribute("aria-hidden", "true"); track.appendChild(segment);
    }
    const pct = total <= 1 ? 50 : ((Math.min(index, total - 1) + .5) / total * 100);
    progress.style.setProperty("--plane-progress", pct + "%");
    const unit = unitOf[items[index] && items[index].id] || unitOf[dailyItems[0] && dailyItems[0].id];
    $("themeLine").hidden = !unit; if (unit) $("themeName").textContent = unit.titulo || "";
  }

  function cheer() {
    const node = $("successReact"); node.classList.remove("is-visible"); void node.offsetWidth; node.classList.add("is-visible");
  }
  function planeHop() {
    const plane = $("segmentProgress").querySelector(".progress-plane"); if (!plane) return;
    plane.classList.remove("hop"); void plane.offsetWidth; plane.classList.add("hop");
  }
  // Nemo aparece SOLO en momentos concretos (Primaria inicial) y luego desaparece.
  let nemoTimer = null;
  const NEMO_LINES = {
    intro: ["Escucha bien.", "¡Tú puedes!", "Vamos allá.", "A por ello."],
    success: ["¡Genial!", "¡Muy bien!", "¡Lo tienes!"],
    retry: ["Casi. Prueba esta pista.", "Casi. Fíjate bien."],
    error: ["Ya casi. Mira la respuesta.", "No pasa nada. Seguimos."]
  };
  // Presencia de Nemo por etapa: inicial = todos los momentos;
  // superior = ocasional (arranque y pistas/errores); ESO = sin Nemo.
  function nemoAllowed(kind) {
    const intensity = exerciseExperience.guideIntensity;
    if (intensity === "high") return true;
    if (intensity === "medium") return kind === "intro" || kind === "retry" || kind === "success";
    if (intensity === "low") return kind === "retry" || kind === "error";
    return false;
  }
  function nemo(kind) {
    if (!nemoAllowed(kind)) return;
    const set = NEMO_LINES[kind] || NEMO_LINES.intro;
    const bubble = $("nemoBubble");
    const art = bubble.querySelector(".nemo-bubble__art");
    if (art && window.ILVisual) art.innerHTML = ILVisual.nemo(kind);
    $("nemoBubbleText").textContent = set[Math.floor(Math.random() * set.length)];
    bubble.dataset.kind = kind; bubble.hidden = false;
    bubble.classList.remove("is-visible"); void bubble.offsetWidth; bubble.classList.add("is-visible");
    clearTimeout(nemoTimer);
    nemoTimer = setTimeout(() => { bubble.classList.remove("is-visible"); setTimeout(() => { bubble.hidden = true; }, 280); }, kind === "intro" ? 1700 : 2300);
  }

  function showExercise() {
    pendingResult = null; updateHeader();
    if (currentController && currentController.destroy) currentController.destroy();
    const guided = !!adaptiveState.guided;
    currentController = IL_ENGINE.render($("stage"), items[index], {
      stage: stageName,
      experience: exerciseExperience,
      guided: guided,
      lastOne: index === items.length - 1,
      onResult: event => {
        pendingResult = event;
        adaptiveState = IL_ADAPTACION.record(adaptiveState, event);
        if (event.correct) planeHop();
      },
      onAttempt: event => recordLearning(event),
      onTechnicalFailure: event => recordLearning(event),
      onFeedback: () => {},
      onNext: result => {
        try {
          const currentEx = items[index];
          const outcome = pendingResult || result || { id: currentEx && currentEx.id, correct: false, learnedExpressions: [] };
          if (reviewMode) {
            if (outcome.eventual_success || outcome.correct) { reviewCorrect += 1; reviewResolved.push(outcome.id); }
          } else if (extraMode()) {
            if (outcome.first_try_correct) bonusCorrect += 1;
          } else {
            ILMission.advance(username, outcome, missionMeta.date);
          }
        } catch (err) { if (window.console) console.error("[Interlanguage] Error al registrar el ejercicio", err); }
        index += 1;
        if (index < items.length) {
          try { showExercise(); }
          catch (err) { if (window.console) console.error("[Interlanguage] Error al mostrar el ejercicio", err); finishMission(); }
        } else finishMission();
      }
    });
    currentController.focus();
  }

  function localizeLessonChrome() {
    if (ageExperience.id !== "secondary") return;
    $("closeMission").setAttribute("aria-label", "Exit session");
    $("exitTitle").textContent = "Do you want to leave this session?";
    $("exitDescription").textContent = "We’ll save your progress so you can continue later.";
    $("keepPractising").textContent = "Keep practising";
    $("saveAndExit").textContent = "Save and exit";
  }

  function renderEnding(state, award) {
    let reward = null, rewardError = false, next = null;
    const ids = items.length ? items.map(ex => ex.id) : (state && state.itemIds || missionMeta.itemIds || []);
    const events = learningEvents.filter(event => ids.includes(event.exercise_id));
    try {
      if (award) {
        const mastery = window.ILMastery ? ILMastery.all(username) : {};
        const achievementItems = newAchievements.map(id => window.IL_ACHIEVEMENTS?.byId[id]?.reward)
          .filter(id => ILWorldData.catalogFor(stageName).some(item => item.id === id));
        reward = ILRewardStore.record(username, {
          sessionKey:practiceSession.client_session_key, date:missionMeta.date, completedAt:new Date().toISOString(),
          completed:true, mode:modeName(), band:stageName, itemIds:ids, events,
          dueIds:dueAtStart, masteredIds:ids.filter(id => mastery[id]?.state === 'mastered'), achievementItems
        });
      } else {
        const projection = ILRewardStore.get(username);
        reward = {projection, session:projection.resultBySession[practiceSession.client_session_key]};
      }
      next = ILRewardStore.next(username, stageName, missionMeta.date || ILMission.today());
    } catch (error) {
      rewardError = true;
      if (window.ILObservability) ILObservability.report('storage_failure', error, {area:'rewards'});
    }
    const truth = IL_LearningEvents.summarize(events, ids);
    const learned = modeName() === 'daily' ? (state?.learnedExpressions || []) : [];
    const settings = window.ILProfileSettings ? ILProfileSettings.getActive() : {};
    return ILSessionEnding.render($('missionSummary'), {
      band:stageName, mode:modeName(), itemIds:ids, events, learned,
      errors:truth.incorrect_ids.length, reward, rewardError, next, settings, progress:completionProgress,
      retry:() => renderEnding(state, true)
    });
  }

  function renderSummary(state, isReview, award) {
    return renderEnding(state, !!award);
  }

  function renderExtraSummary() {
    return renderEnding(null, true);
  }

  async function finishExtraEvidence() {
    const truth=IL_LearningEvents.summarize(learningEvents,items.map(item=>item.id));
    try { await ILAuth.finishPracticeSession(practiceSession,truth); }
    catch (error) { if(window.ILObservability)ILObservability.report('network_failure',error,{area:'lesson',operation:'finish_extra'}); }
  }

  async function finishMission() {
   try {
    if (index < items.length) {
      errorState('Sesión interrumpida', 'No hemos podido abrir el siguiente ejercicio. Tu avance anterior se conserva; vuelve a entrar para continuar.');
      return;
    }
    if (currentController && currentController.destroy) currentController.destroy();
    if (examMode) { await finishExtraEvidence(); ILMission.resetExam(username); renderExtraSummary(); return; }
    if (skillMode) {
      const sessionTruth = IL_LearningEvents.summarize(learningEvents, missionMeta.itemIds);
      try { await ILAuth.finishPracticeSession(practiceSession, sessionTruth); }
      catch (error) { if (window.ILObservability) ILObservability.report("network_failure", error, { area:"lesson", operation:"finish_skill_practice", skill:requestedSkill }); }
      renderExtraSummary(sessionTruth); return;
    }
    if (bonusMode || reviewDueMode) { await finishExtraEvidence(); renderExtraSummary(); return; }
    if (reviewMode) {
      await finishExtraEvidence();
      ILMission.resolveErrors(username, reviewResolved, missionMeta.date);
      const state = ILMission.get(username, missionMeta.date) || ILMission.blank(missionMeta);
      renderSummary(state, true, true); return;
    }
    const state = ILMission.complete(username, undefined, missionMeta.date);
    if (!state.completionRecorded) {
      const sessionTruth = IL_LearningEvents.summarize(learningEvents, state.itemIds);
      const summary = { correct: sessionTruth.first_try_correct_count, total: sessionTruth.evaluable_count, allCorrect:sessionTruth.perfect, perfect:sessionTruth.perfect, maxCorrectStreak:state.maxCorrectStreak };
      const streakPreview = window.IL_MOTIVACION && completionProgress
        ? window.IL_MOTIVACION.nextStreak({ current: completionProgress.streak, last_practice_date: completionProgress.last, freezes_available: completionProgress.freezes }, missionMeta.date)
        : null;
      try {
        const progress = await ILAuth.completeLesson(summary);
        if (progress) { progress.streakSaved = !!(streakPreview && streakPreview.usedFreeze); completionProgress = progress; ILMission.markCompletionRecorded(username, missionMeta.date); $("headerStreak").textContent = progress.streak || 0; }
        // Fase 3 · logros conseguidos en esta misión (se persisten; migración en la primera lectura).
        try {
          if (progress && window.IL_ACHIEVEMENTS && window.ILAchievements) {
            let week = null; try { week = await ILAuth.getWeekActivity(); } catch (e) {}
            const gained = IL_ACHIEVEMENTS.evaluate({
              band: stageName,
              lessons: progress.lessons || 0,
              streak: progress.streak || 0,
              weekCount: week ? (week.count || 0) : 0,
              weekGoal: week ? (week.goal || 5) : 5,
              session: { total:state.total, allCorrect:sessionTruth.perfect, maxCorrectStreak:state.maxCorrectStreak },
              earned: ILAchievements.earned(username)
            });
            if (gained.length) newAchievements = ILAchievements.add(username, gained);
          }
        } catch (e) {}
        await ILAuth.finishPracticeSession(practiceSession, sessionTruth);
      } catch (error) {
        if (window.ILToast) ILToast("Misión guardada. Sincronizaremos tu progreso cuando sea posible.", { type: "info", duration: 3600 });
      }
    }
    renderSummary(ILMission.get(username, missionMeta.date) || state, false, true);
   } catch (err) {
    if (window.console) console.error("[Interlanguage] No se pudo cerrar la misión", err);
    const host = $("missionSummary"); const sec = ageExperience.id === "secondary";
    if (host) {
      host.classList.remove("hidden");
      host.innerHTML = '<div class="il-state"><div class="ic">' + ILIcon("plane") + '</div><h2>' + (sec ? "Session complete" : "¡Misión completada!") + '</h2><p>' + (sec ? "Your progress is saved." : "Tu progreso está guardado.") + '</p><a class="btn btn-primary" href="inicio.html">' + (sec ? "Back to home" : "Volver al inicio") + '</a></div>';
      if (host.focus) host.focus();
    } else location.href = "inicio.html";
   }
  }

  function resumeTimer() { if (!reviewMode && !extraMode()) ILMission.begin(username, missionMeta); }
  $("closeMission").addEventListener("click", () => {
    if (!reviewMode && !extraMode()) ILMission.pause(username, undefined, missionMeta.date);
    $("exitDialog").showModal(); requestAnimationFrame(() => $("keepPractising").focus());
  });
  $("keepPractising").addEventListener("click", () => { $("exitDialog").close("continue"); });
  $("saveAndExit").addEventListener("click", () => { $("exitDialog").close("exit"); location.href = skillMode ? "practicar.html" : "inicio.html"; });
  $("exitDialog").addEventListener("cancel", event => { event.preventDefault(); $("exitDialog").close("continue"); });
  $("exitDialog").addEventListener("close", () => { if ($("exitDialog").returnValue !== "exit") { resumeTimer(); $("closeMission").focus(); } });
  addEventListener("beforeunload", () => { if (!reviewMode && !extraMode() && username && missionMeta) ILMission.pause(username, undefined, missionMeta.date); });

  (async () => {
    try {
      await ILContent.ready;
      units = (window.IL_CONTENIDO && window.IL_CONTENIDO.unidades) || [];
      units.forEach(unit => (unit.ejercicios || []).forEach(exercise => { byId[exercise.id] = exercise; unitOf[exercise.id] = unit; }));
      const profile = await ILAuth.getProfile();
      if (!profile) { location.href = "index.html"; return; }
      if (profile.is_admin) { location.href = "admin.html"; return; }
      if (profile.must_change_password) { location.href = "cambiar-clave.html"; return; }
      username = profile.username || ""; stageName = IL_ETAPA.apply(profile); ageExperience = IL_ETAPA.current().config; exerciseExperience = IL_ETAPA.current().exercise;
      dueAtStart = window.ILMastery ? ILMastery.due(username) : [];
      localizeLessonChrome();
      ILProfileSettings.setActive(username, profile.sex);
      const [placement, progress] = await Promise.all([ILAuth.getPlacement(), ILAuth.getProgress()]);
      placementState = placement;
      completionProgress = progress;
      $("headerStreak").textContent = progress ? (progress.streak || 0) : 0;
      if (skillMode) {
        const assignedUnits = (ageExperience.unitIds && ageExperience.unitIds.length) ? units.filter(unit => ageExperience.unitIds.indexOf(unit.id) !== -1) : units;
        const allAssigned = assignedUnits.flatMap(unit => unit.ejercicios || []);
        const compatible = window.IL_MATRIZ && IL_MATRIZ.filtra ? IL_MATRIZ.filtra(allAssigned, stageName) : allAssigned;
        const validSkill = ILPracticeOptions.SKILLS.indexOf(requestedSkill) !== -1;
        const available = compatible.filter(exercise => validSkill && exercise.habilidad === requestedSkill);
        if (!validSkill || !available.length) {
          if (window.ILObservability) ILObservability.report("invalid_data", new Error("Skill practice unavailable"), { area:"lesson", operation:"load_skill", skill:requestedSkill, age_band:stageName });
          const hasPractice = compatible.some(exercise => ILPracticeOptions.SKILLS.indexOf(exercise.habilidad) !== -1);
          if (hasPractice) { location.replace("practicar.html?notice=unavailable"); return; }
          $("missionName").textContent = ageExperience.id === "secondary" ? "Practice" : "Practicar";
          $("exerciseCount").textContent = "";
          $("segmentProgress").hidden = true;
          $("themeLine").hidden = true;
          errorState(
            ageExperience.id === "secondary" ? "Practice unavailable" : "Práctica no disponible",
            ageExperience.id === "secondary" ? "There is no compatible practice content available right now." : "No hay contenido compatible disponible ahora mismo.",
            { href:"inicio.html", label:ageExperience.id === "secondary" ? "Back to home" : "Volver a Inicio" }
          );
          return;
        }
        const cachedEvents = await ILAuth.getCachedLearningEvents();
        items = ILPracticeOptions.selectExercises({ exercises:available, cefr:placement && placement.cefr, recentEvents:cachedEvents, limit:exerciseExperience.sessionSize });
        missionMeta = { date:ILMission.today(), unitId:"skill-" + requestedSkill, unitTitle:ILCopy.practiceSkill(requestedSkill, stageName), itemIds:items.map(item => item.id) };
        const clientSessionKey = [username, missionMeta.date, "extra", missionMeta.unitId].join("|");
        learningEvents = (cachedEvents || []).filter(event => event.client_session_key === clientSessionKey);
        practiceSession = await ILAuth.startPracticeSession({ client_session_key:clientSessionKey, mode:"extra", age_band:stageName,
          cefr:placement && placement.cefr, content_version:"1", activities_planned:missionMeta.itemIds }) || { id:null, client_session_key:clientSessionKey };
        if (!practiceSession.client_session_key) practiceSession.client_session_key = clientSessionKey;
        $("missionName").textContent = missionMeta.unitTitle;
        index = 0; showExercise(); return;
      }
      dailyItems = ILMission.getOrCreateSession({ username, units, banda: stageName, cefr: placement.cefr, matrix: window.IL_MATRIZ, limit: exerciseExperience.sessionSize, unitIds: ageExperience.unitIds, skillPriority: ageExperience.skillPriority });
      if (!dailyItems.length) { errorState("Contenido no disponible", "Todavía no hay ejercicios preparados para tu nivel hoy."); return; }
      const primaryUnit = unitOf[dailyItems[0].id] || units[0];
      missionMeta = { date: ILMission.today(), unitId: primaryUnit ? primaryUnit.id : "", unitTitle: missionTitle(primaryUnit), itemIds: dailyItems.map(item => item.id) };
      const clientSessionKey = [username, missionMeta.date, modeName(), missionMeta.unitId || "mission"].concat(modeName() === 'daily' ? [] : [params.get('mode') || 'practice']).join("|");
      const cachedEvents = await ILAuth.getCachedLearningEvents();
      learningEvents = (cachedEvents || []).filter(event => event.client_session_key === clientSessionKey);
      practiceSession = await ILAuth.startPracticeSession({ client_session_key:clientSessionKey, mode:modeName(), age_band:stageName,
        cefr:placement && placement.cefr, content_version:"1", activities_planned:missionMeta.itemIds }) || { id:null, client_session_key:clientSessionKey };
      if (!practiceSession.client_session_key) practiceSession.client_session_key = clientSessionKey;
      // Pool de bonus "una más": ejercicios aptos del/los tema(s) que NO salieron hoy, victoria fácil primero.
      const bonusUnits = (ageExperience.unitIds && ageExperience.unitIds.length) ? units.filter(u => ageExperience.unitIds.indexOf(u.id) !== -1) : units;
      const bonusAll = bonusUnits.flatMap(u => u.ejercicios || []);
      const bonusApt = window.IL_MATRIZ && IL_MATRIZ.filtra ? IL_MATRIZ.filtra(bonusAll, stageName) : bonusAll;
      const usedToday = new Set(dailyItems.map(i => i.id));
      const gentleRank = ex => ex.tipo === "elegir_imagen" ? 0 : (ex.tipo === "elegir_texto" ? 1 : 2);
      bonusPool = bonusApt.filter(ex => !usedToday.has(ex.id)).sort((a, b) => gentleRank(a) - gentleRank(b));
      if (bonusMode) {
        items = bonusPool.slice(0, 3);
        if (!items.length) { location.href = "inicio.html"; return; }
        $("missionName").textContent = ageExperience.id === "secondary" ? "Extra practice" : (ageExperience.id === "primary-young" ? "Una más" : "Práctica extra");
        index = 0; showExercise(); return;
      }
      if (reviewDueMode) {
        // Repaso espaciado: los ejercicios cuyo dominio vence hoy, del banco disponible.
        const dueIds = window.ILMastery ? ILMastery.due(username) : [];
        items = dueIds.map(id => byId[id]).filter(Boolean).slice(0, exerciseExperience.sessionSize);
        if (!items.length) { location.href = "inicio.html"; return; }
        $("missionName").textContent = ageExperience.id === "secondary" ? "Review" : "Repaso";
        index = 0; showExercise(); return;
      }
      if (examMode) {
        // Examen periódico: repaso acumulativo de lo YA practicado, priorizando lo fallado
        // y lo que vence, intercalando habilidades. Un poco más largo que una misión.
        const map = window.ILMastery ? ILMastery.all(username) : {};
        const dueSet = new Set(window.ILMastery ? ILMastery.due(username) : []);
        const rankOf = id => {
          const c = map[id] || {};
          let r = 0;
          if (c.state === "needs_review" || c.last_result === "incorrect") r -= 100; // fallos primero
          if (dueSet.has(id)) r -= 40;                                                // luego lo que vence
          r += Math.min(20, Number(c.evidence) || 0);                                 // menos evidencia → antes
          return r;
        };
        const seenIds = Object.keys(map).filter(id => byId[id]).sort((a, b) => rankOf(a) - rankOf(b));
        const size = Math.min(seenIds.length, (exerciseExperience.sessionSize || 6) + 2);
        const picked = []; let lastSkill = null; const rest = seenIds.slice();
        while (rest.length && picked.length < size) {
          let i = rest.findIndex(id => byId[id].habilidad !== lastSkill);
          if (i === -1) i = 0;
          const id = rest.splice(i, 1)[0]; picked.push(id); lastSkill = byId[id].habilidad;
        }
        items = picked.map(id => byId[id]).filter(Boolean);
        if (!items.length) { location.href = "inicio.html"; return; }
        $("missionName").textContent = ageExperience.id === "secondary" ? "Challenge" : "Reto";
        index = 0; showExercise(); return;
      }
      $("missionName").textContent = (reviewMode ? (ageExperience.id === "secondary" ? "Review · " : "Repaso · ") : "") + missionMeta.unitTitle;
      const state = ILMission.ensure(username, missionMeta);
      adaptiveState = IL_ADAPTACION.create({ guided: reviewMode || (state.incorrectIds || []).length > 0 });
      if (reviewMode) {
        items = (state.incorrectIds || []).map(id => byId[id]).filter(Boolean);
        if (!items.length) { location.href = "inicio.html"; return; }
      } else {
        items = dailyItems;
        if (state.status === "completed") {
          if (!state.completionRecorded) { index=items.length; await finishMission(); }
          else renderSummary(state, false);
          return;
        }
        const active = ILMission.begin(username, missionMeta);
        index = Math.min(active.currentIndex || 0, items.length - 1);
      }
      showExercise();
    } catch (error) {
      errorState("No hemos podido cargar la misión", "Revisa tu conexión e inténtalo de nuevo.");
    }
  })();
</script>
