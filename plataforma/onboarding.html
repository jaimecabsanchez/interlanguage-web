<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Bienvenido! · Interlanguage</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css?v=20260810f">
<link rel="stylesheet" href="app.css?v=20260809d">
<link rel="stylesheet" href="etapa.css?v=20260809d">
<style>
  body{font-family:var(--il-font-body);background:
    radial-gradient(120% 45% at 100% 0%, #FDECE4 0%, transparent 55%),
    radial-gradient(120% 45% at 0% 4%, #E7F2ED 0%, transparent 52%),
    var(--il-cream);}
  .ob{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px}
  .ob-top{display:flex;justify-content:center;gap:8px;padding:26px 0 6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--il-line-2);transition:background var(--il-motion),width var(--il-motion)}
  .dot.on{background:var(--il-primary)}
  .dot.now{width:24px;border-radius:6px}
  .ob-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  /* Símbolo de cada paso */
  .ob-fox{width:120px;height:120px;margin:0 auto 16px;border-radius:var(--il-radius-xl);display:grid;place-items:center;color:#fff;line-height:1;
    background:var(--il-primary);box-shadow:var(--il-shadow-md);
    animation:obPop .42s cubic-bezier(.2,1.25,.3,1) both}
  .ob-fox svg{width:54px;height:54px}
  @keyframes obPop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
  @keyframes obUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  body[data-stage="eso"] .ob-fox{width:88px;height:88px;border-radius:var(--il-radius-md)}
  body[data-stage="eso"] .ob-fox svg{width:38px;height:38px}
  .ob-h{font-family:var(--il-font-display);font-weight:800;color:var(--il-navy);font-size:1.7rem;margin:6px 0 8px;animation:obUp .38s cubic-bezier(.2,.7,.3,1) .07s both}
  .ob-p{color:var(--il-soft);font-size:1.1rem;max-width:360px;margin:0 auto;animation:obUp .38s cubic-bezier(.2,.7,.3,1) .13s both}
  .colors{display:flex;gap:14px;justify-content:center;margin-top:24px;animation:obUp .38s cubic-bezier(.2,.7,.3,1) .19s both}
  .swatch{width:52px;height:52px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .swatch:hover{transform:scale(1.06)}
  .swatch[aria-pressed="true"]{border-color:var(--il-navy);transform:scale(1.1);box-shadow:0 10px 20px -10px rgba(22,41,74,.4)}
  .ob-actions{padding:16px 0 28px;display:flex;gap:10px;align-items:center}
  .ob-actions .btn{flex:1;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .ob-actions .btn:active{transform:scale(.98)}
  .ob-skip{background:none;border:none;color:var(--il-faint);font-family:inherit;font-size:.9rem;cursor:pointer}
  @media (prefers-reduced-motion: reduce){ .ob-fox,.ob-h,.ob-p,.colors{animation:none} .swatch[aria-pressed="true"]{transform:none} }
</style>
</head>
<body>
<div class="ob">
  <div class="ob-top">
    <span class="dot on" data-d="0"></span><span class="dot" data-d="1"></span><span class="dot" data-d="2"></span>
  </div>

  <div class="ob-main" id="main"></div>

  <div class="ob-actions">
    <button class="ob-skip" id="skip" hidden>Saltar</button>
    <button class="btn btn-primary btn-block" id="next">Siguiente</button>
  </div>
</div>

<script src="layout.js?v=20260809d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260809d"></script>
<script src="auth-utils.js?v=20260809d"></script>
<script src="etapa.js?v=20260810c"></script>
<script src="auth.js?v=20260809d"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let name = "campeón", stage = "p56", color = "#FF6B4A";

  const steps = () => ([
    { icon:"plane", h:"¡Hola, "+name+"!", p:"Tu avión de papel representa todo lo que vas avanzando. Elige tu color:", colors:true },
    { icon:"target", h:"Cada día, una misión corta", p:"Solo unos minutos de práctica para mantener fresco tu inglés." },
    { icon:"shield", h:"Los errores también enseñan", p:"Te explicaremos cada error y podrás volver a intentarlo sin agobios." }
  ]);
  let i = 0;

  function render() {
    const s = steps()[i];
    $("main").innerHTML =
      '<div class="ob-fox" aria-hidden="true">'+ILIcon(s.icon)+'</div>' +
      '<h1 class="ob-h">'+s.h+'</h1>' +
      '<p class="ob-p">'+s.p+'</p>' +
      (s.colors ? '<div class="colors" role="group" aria-label="Elige tu color">' +
        ['#FF6B4A','#1E9C74','#16294A','#8E7CC3'].map(c =>
          '<button class="swatch" style="background:'+c+'" data-c="'+c+'" aria-label="Color" aria-pressed="'+(c===color)+'"></button>').join('') +
        '</div>' : '');
    $("main").querySelectorAll('.swatch').forEach(b => b.onclick = () => {
      color = b.getAttribute('data-c');
      try { localStorage.setItem('il_avatar_color', color); } catch(e){}
      $("main").querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x===b));
    });
    document.querySelectorAll('.dot').forEach((d,di)=>{ d.classList.toggle('on', di<=i); d.classList.toggle('now', di===i); });
    $("next").textContent = i === steps().length-1 ? "¡Empezar!" : "Siguiente";
    $("skip").hidden = (stage !== "eso") || i === steps().length-1;
  }

  function finish() {
    try { const u = (window.__user||''); localStorage.setItem('il_onboarded_'+u, '1'); } catch(e){}
    location.href = "test-nivel.html";   // primero el test de nivel; luego ya empieza a practicar
  }
  $("next").addEventListener("click", () => { if (i < steps().length-1) { i++; render(); } else finish(); });
  $("skip").addEventListener("click", finish);

  (async () => {
    const p = await ILAuth.getProfile();
    if (!p) { location.href = "index.html"; return; }
    if (p.is_admin) { location.href = "admin.html"; return; }
    window.__user = p.username;
    name = (p.full_name || "").split(" ")[0] || "campeón";
    stage = IL_ETAPA.apply(p);
    render();
  })();
</script>
</body>
</html>
