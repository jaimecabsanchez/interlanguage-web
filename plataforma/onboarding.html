<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Bienvenido! · Interlanguage</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../images/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="etapa.css">
<style>
  body{background:var(--il-cream);font-family:var(--il-font-body)}
  .ob{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px}
  .ob-top{display:flex;justify-content:center;gap:8px;padding:22px 0 6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--il-line-2);transition:background var(--il-motion)}
  .dot.on{background:var(--il-coral)}
  .ob-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ob-fox{font-size:5rem;line-height:1;margin-bottom:8px}
  body[data-stage="eso"] .ob-fox{font-size:3rem}
  .ob-h{font-family:var(--il-font-display);font-weight:800;color:var(--il-navy);font-size:1.7rem;margin:6px 0 8px}
  .ob-p{color:var(--il-soft);font-size:1.1rem;max-width:360px;margin:0 auto}
  .colors{display:flex;gap:14px;justify-content:center;margin-top:22px}
  .swatch{width:52px;height:52px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .swatch[aria-pressed="true"]{border-color:var(--il-navy);transform:scale(1.08)}
  .ob-actions{padding:16px 0 28px;display:flex;gap:10px;align-items:center}
  .ob-actions .btn{flex:1}
  .ob-skip{background:none;border:none;color:var(--il-faint);font-family:inherit;font-size:.9rem;cursor:pointer}
  @media (prefers-reduced-motion: reduce){ .swatch[aria-pressed="true"]{transform:none} }
</style>
</head>
<body>
<div class="ob">
  <div class="ob-top">
    <span class="dot on" data-d="0"></span><span class="dot" data-d="1"></span><span class="dot" data-d="2"></span>
  </div>

  <div class="ob-main" id="main"></div>

  <div class="ob-actions">
    <button class="ob-skip" id="skip" hidden>Saltar</button>
    <button class="btn btn-primary btn-block" id="next">Siguiente</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-utils.js"></script>
<script src="etapa.js"></script>
<script src="auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let name = "campeón", stage = "p56", color = "#FF6B4A";

  const steps = () => ([
    { fox:"🦊", h:"¡Hola, "+name+"! Soy Nemo", p:"Un zorro viajero. Vamos a aprender inglés juntos, un poquito cada día. Elige tu color:", colors:true },
    { fox:"🎯", h:"Cada día, una misión corta", p:"Nada de exámenes. Solo unos minutos de juego para no olvidar el inglés." },
    { fox:"💪", h:"Si fallas, no pasa nada", p:"Se explica y lo vuelves a intentar. ¡Aquí se aprende sin agobios!" }
  ]);
  let i = 0;

  function render() {
    const s = steps()[i];
    $("main").innerHTML =
      '<div class="ob-fox" aria-hidden="true">'+s.fox+'</div>' +
      '<h1 class="ob-h">'+s.h+'</h1>' +
      '<p class="ob-p">'+s.p+'</p>' +
      (s.colors ? '<div class="colors" role="group" aria-label="Elige tu color">' +
        ['#FF6B4A','#1E9C74','#16294A','#8E7CC3'].map(c =>
          '<button class="swatch" style="background:'+c+'" data-c="'+c+'" aria-label="Color" aria-pressed="'+(c===color)+'"></button>').join('') +
        '</div>' : '');
    $("main").querySelectorAll('.swatch').forEach(b => b.onclick = () => {
      color = b.getAttribute('data-c');
      try { localStorage.setItem('il_avatar_color', color); } catch(e){}
      $("main").querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x===b));
    });
    document.querySelectorAll('.dot').forEach((d,di)=>d.classList.toggle('on', di<=i));
    $("next").textContent = i === steps().length-1 ? "¡Empezar!" : "Siguiente";
    $("skip").hidden = (stage !== "eso") || i === steps().length-1;
  }

  function finish() {
    try { const u = (window.__user||''); localStorage.setItem('il_onboarded_'+u, '1'); } catch(e){}
    location.href = "test-nivel.html";   // primero el test de nivel; luego ya empieza a practicar
  }
  $("next").addEventListener("click", () => { if (i < steps().length-1) { i++; render(); } else finish(); });
  $("skip").addEventListener("click", finish);

  (async () => {
    const p = await ILAuth.getProfile();
    if (!p) { location.href = "index.html"; return; }
    if (p.is_admin) { location.href = "admin.html"; return; }
    window.__user = p.username;
    name = (p.full_name || "").split(" ")[0] || "campeón";
    stage = IL_ETAPA.apply(p);
    render();
  })();
</script>
</body>
</html>
